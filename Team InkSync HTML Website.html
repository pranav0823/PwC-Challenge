  </div>`;
}


/* ==========================================================================
 * Trend to Design journey · concept generation, commercial validation,
 * the concept room, refinement and the human and AI decision trail.
 *
 * Everything in this block is driven by the four configuration controls
 * (brand, AI involvement, review model, connected signals) and by what the
 * person using the prototype actually does. Nothing here is a static mock.
 * ========================================================================== */

const DX_FUNCTIONS = [
  { id: "design", name: "Design", owns: "Creative direction and the edit", reads: "Brand fit, craft, silhouette" },
  { id: "merch", name: "Merchandising", owns: "Range, price ladder and first cut", reads: "Expected demand, price suitability" },
  { id: "mktg", name: "Marketing", owns: "Story and campaign timing", reads: "Trend relevance, peak window" },
  { id: "comm", name: "Commercial", owns: "Contribution and risk", reads: "Commercial risk, deadstock exposure" }
];

const DX_VERDICTS = [
  { id: "approve", label: "Approve", rounds: 0, tone: "ok" },
  { id: "flag", label: "Flag a change", rounds: 1, tone: "warn" },
  { id: "hold", label: "Hold", rounds: 2, tone: "stop" }
];

const DX_DIRECTIONS = [
  { key: "A", word: "Anchor", note: "The safest read of the theme, closest to bodies that already sell." },
  { key: "B", word: "Edge", note: "The theme pushed one step past what the data alone supports." },
  { key: "C", word: "Carry", note: "The theme applied to a carry over body already in the range." }
];

const DX_ELEMENTS = [
  { id: "silhouette", label: "Silhouette" },
  { id: "palette", label: "Colour story" },
  { id: "fabric", label: "Fabric and trim" },
  { id: "detail", label: "Graphic and detail" }
];

const DX_CUTS = [
  { id: "short", label: "Short first cut", mult: 0.55, note: "Read live sell through before committing the rest of the buy." },
  { id: "planned", label: "Planned cut", mult: 1.0, note: "The commitment the seasonal plan assumed." },
  { id: "full", label: "Full season cut", mult: 1.45, note: "One commitment. No recut window is needed or available." }
];

/* Material profile per theme. Held here rather than on the theme record so the
   technologist owns it, which is also how the claim is signed off in practice. */
const DX_MATERIAL = {
  "TR-118": { score: 68, note: "Garment dyed cotton twill. Single fibre and mechanically recyclable; dye load is the open impact." },
  "TR-121": { score: 44, note: "Viscose blend. Fibre origin needs a certified mill before any EcoWeave or EU claim can be made." },
  "TR-126": { score: 31, note: "Lurex jacquard. Mixed fibre metallic, not separable at end of life." },
  "TR-130": { score: 82, note: "Recycled ripstop. Membrane bonding limits recyclability but input content is verified at source." },
  "TR-134": { score: 59, note: "Yarn dyed lambswool. Durable and repairable; traceability sits with the spinner." },
  "TR-139": { score: 74, note: "Recycled cotton comfort denim. Stretch content caps the recycled share at the current mill." }
};

const DX_SILHOUETTES = {
  "TR-118": ["Straight leg cargo, dropped pocket", "Wide leg cargo, cropped at the ankle", "Carry over tapered chino, pocket detail added"],
  "TR-121": ["Open stitch crew, boxy body", "Elongated sheer cardigan", "Carry over fine gauge crew, open stitch panel"],
  "TR-126": ["Bias cut slip, matte metallic", "Column dress, jacquard panel", "Carry over wrap dress in festive cloth"],
  "TR-130": ["City length shell, concealed hood", "Cropped technical overshirt", "Carry over anorak, three layer membrane"],
  "TR-134": ["Overshirt in yarn dyed check", "Single breasted check coat", "Carry over crew knit, check yoke"],
  "TR-139": ["Mid rise straight, comfort stretch", "Relaxed tapered, rinse black", "Carry over slim, recycled cotton body"]
};

const DX_DETAILS = {
  "TR-118": ["Webbing pull, tonal", "Utility tab at the hem", "Existing trim block, no new tooling"],
  "TR-121": ["Raw edge finish", "Contrast picot at the neck", "Existing neck finish reused"],
  "TR-126": ["Tonal metallic thread", "Self covered button", "Existing festive trim set"],
  "TR-130": ["Bonded seam tape", "Reflective pull at the zip", "Existing zip and puller"],
  "TR-134": ["Leather tab, vegetable tanned", "Contrast under collar", "Existing collar stand"],
  "TR-139": ["Tonal bartack", "Woven flag at the back pocket", "Existing pocket bag and label"]
};

let DX = {
  concept: "A",
  pass: 1,
  elements: {},
  cut: {},
  reviews: {},
  approved: {},
  packs: {},
  handoff: {},
  trail: [],
  clock: 0,
  seeded: ""
};

/* ------------------------------------------------------------ the trail -- */

function dxStamp() {
  const start = new Date(Date.UTC(2026, 8, 22, 3, 40, 0));
  start.setUTCMinutes(start.getUTCMinutes() + DX.clock * 7);
  DX.clock += 1;
  return new Intl.DateTimeFormat("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" }).format(start);
}

function dxLog(actor, what, detail, concept = DX.concept) {
  DX.trail.unshift({ at: dxStamp(), actor, what, detail, concept, brand: WS.brand, trend: WS.trend });
  if (DX.trail.length > 60) DX.trail.length = 60;
}

/* Configuration changes invalidate the generated pass, exactly as a real
   copilot would: a different brand or a different signal set is a different
   brief, so the drafted directions are drawn again. Human decisions already
   recorded stay on the trail; they are evidence, not scratch work. */
function dxSeed() {
  return `${WS.brand}|${WS.trend}|${wsEffectiveAutonomy()}|${WS.review}|${WS_SIGNALS.filter((s) => WS.signals[s.id]).map((s) => s.id).join(",")}`;
}

function dxSyncSeed() {
  const seed = dxSeed();
  if (DX.seeded === seed) return false;
  const first = DX.seeded === "";
  DX.seeded = seed;
  DX.elements = {};
  DX.reviews = {};
  DX.approved = {};
  DX.packs = {};
  DX.handoff = {};
  DX.pass = 1;
  if (!first) dxLog("Agent", "Brief changed, directions redrawn", "Configuration moved, so the drafted directions were regenerated against the new brief.");
  return true;
}

/* --------------------------------------------------------- the concepts -- */

function dxTrend() {
  return WS_TRENDS.find((t) => t.id === WS.trend) || WS_TRENDS[0];
}

function dxConfidence(trend = dxTrend()) {
  const coverage = wsSignalCoverage();
  const evidence = trend.srcs.filter((s) => WS.signals[s]).length;
  return trend.conf * (0.45 + 0.55 * coverage) * (evidence / Math.max(1, trend.srcs.length));
}

function dxGenerativeAllowed(brand = wsBrand()) {
  return brand.maxAI >= 2 && wsEffectiveAutonomy(brand) >= 2;
}

function dxConcepts() {
  const trend = dxTrend();
  const brand = wsBrand();
  const level = wsEffectiveAutonomy(brand);
  const confidence = dxConfidence(trend);
  const generative = dxGenerativeAllowed(brand);
  const count = level === 0 ? 0 : level === 1 ? 1 : level === 2 ? 2 : 3;
  return DX_DIRECTIONS.slice(0, Math.max(1, count)).map((dir, index) => {
    const id = dir.key;
    const sil = (DX_SILHOUETTES[trend.id] || DX_SILHOUETTES["TR-118"])[index] || "Carry over body";
    const det = (DX_DETAILS[trend.id] || DX_DETAILS["TR-118"])[index] || "Existing trim block";
    const elements = [
      { id: "silhouette", label: "Silhouette", value: sil, origin: generative ? "Drafted" : "Reference only" },
      { id: "palette", label: "Colour story", value: trend.palette.map(([n]) => n).join(", "), origin: level >= 1 ? "Drafted" : "Manual" },
      { id: "fabric", label: "Fabric and trim", value: trend.fabric, origin: level >= 1 ? "Drafted" : "Manual" },
      { id: "detail", label: "Graphic and detail", value: det, origin: generative ? "Drafted" : "Reference only" }
    ];
    const bias = [0, 0.06, -0.05][index] || 0;
    return { id, dir, elements, bias, confidence, trend, brand };
  });
}

function dxConcept(id = DX.concept) {
  const list = dxConcepts();
  return list.find((c) => c.id === id) || list[0];
}

function dxElementState(conceptId, elementId) {
  return DX.elements[`${conceptId}:${elementId}`] || "open";
}

function dxCut(conceptId = DX.concept) {
  return DX.cut[conceptId] || "planned";
}

function dxCutDef(conceptId = DX.concept) {
  return DX_CUTS.find((c) => c.id === dxCut(conceptId)) || DX_CUTS[1];
}

/* ---------------------------------------------------- commercial screen -- */

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function dxValidation(concept = dxConcept()) {
  const trend = concept.trend;
  const brand = concept.brand;
  const cycle = wsCycle(brand);
  const confidence = concept.confidence;
  const coverage = wsSignalCoverage();
  const cutDef = dxCutDef(concept.id);
  const material = DX_MATERIAL[trend.id] || { score: 55, note: "Material profile not yet returned by the technologist." };
  const states = DX_ELEMENTS.map((el) => dxElementState(concept.id, el.id));
  const modified = states.filter((st) => st === "modify").length;
  const rejected = states.filter((st) => st === "reject").length;
  const open = states.filter((st) => st === "open").length;

  // Relevance decays with the weeks still to run against the theme's own peak.
  const landsIn = cycle.total;
  const relevance = clamp01(confidence * (1 - Math.max(0, landsIn - trend.peak) / 12) * (0.75 + 0.25 * coverage) + concept.bias);

  const fitsBrand = trend.brands.includes(brand.id);
  const customer = clamp01((fitsBrand ? 0.82 : 0.52) + (trend.momentum / 260) + concept.bias);

  // A high craft brand run at a high autonomy setting loses brand fit. The
  // tension is the point: it is what the cap is protecting.
  const overreach = Math.max(0, wsEffectiveAutonomy(brand) - (1 - brand.craft) * 4) / 3;
  const brandFit = clamp01((fitsBrand ? 0.86 : 0.58) - overreach * brand.craft * 0.55 - (concept.id === "B" ? 0.08 : 0) + modified * 0.05);

  const units = Math.round(trend.drop * (brand.rev / 0.38) * (0.75 + 0.5 * confidence) * cutDef.mult);
  const demand = clamp01(0.35 + confidence * 0.5 + trend.momentum / 300);

  const priceFit = clamp01(0.55 + (brand.craft > 0.6 ? 0.28 : 0.18) * (fitsBrand ? 1 : 0.4) + coverage * 0.18 - (concept.id === "B" ? 0.06 : 0));

  const lateRisk = clamp01(Math.max(0, landsIn - 8) / 6);
  const risk = clamp01(0.18 + (1 - confidence) * 0.45 + lateRisk * 0.3 + (cutDef.mult - 1) * 0.35 + open * 0.022 + rejected * 0.055);

  const deadstock = clamp01(0.10 + (1 - confidence) * 0.42 + (cutDef.mult - 0.55) * 0.34 + lateRisk * 0.22);

  const rows = [
    { id: "relevance", label: "Trend relevance at launch", value: relevance, kind: "pct", note: `Theme peaks in ${trend.peak} weeks; this configuration lands in ${landsIn.toFixed(1)}.` },
    { id: "customer", label: "Target customer fit", value: customer, kind: "pct", note: fitsBrand ? `${brand.name} is a named fit for this theme.` : `Theme indexes to another brand in the portfolio.` },
    { id: "brand", label: "Brand fit", value: brandFit, kind: "pct", note: modified ? `${modified} element${modified > 1 ? "s" : ""} edited by the designer, which is what moves a drafted concept toward the house.` : overreach > 0.05 ? `AI involvement is running ahead of what ${brand.name} craft allows.` : `Within the guardrail set for ${brand.name}.` },
    { id: "demand", label: "Expected demand", value: demand, kind: "pct", note: `${fmtUnits(units)} units on a ${cutDef.label.toLowerCase()}.` },
    { id: "price", label: "Price suitability", value: priceFit, kind: "pct", note: `Theme band ${trend.price} against the ${brand.pos.split("·")[0].trim().toLowerCase()} ladder.` },
    { id: "risk", label: "Commercial risk", value: risk, kind: "pct", invert: true, note: open ? `${open} element${open > 1 ? "s" : ""} still undecided${rejected ? ` and ${rejected} rejected` : ""}, which is risk until it is closed.` : lateRisk > 0.05 ? "Cycle time is pushing this past the trend window." : "Every element is decided and the concept lands inside the trend window." },
    { id: "material", label: "Material profile", value: material.score / 100, kind: "pct", note: material.note },
    { id: "deadstock", label: "Deadstock exposure", value: deadstock, kind: "pct", invert: true, note: `${cutDef.note}` }
  ];

  const commercial = rows.filter((r) => ["relevance", "customer", "brand", "demand", "price"].includes(r.id));
  const penalties = rows.filter((r) => r.invert);
  const score = clamp01(
    commercial.reduce((s, r) => s + r.value, 0) / commercial.length -
    penalties.reduce((s, r) => s + r.value, 0) / penalties.length * 0.45 +
    (material.score / 100) * 0.06
  );
  const verdict = score >= 0.62 ? "Brief it" : score >= 0.48 ? "Brief with a named condition" : "Do not commit";
  return { rows, score, verdict, units, cutDef, material, confidence, cycle };
}

/* --------------------------------------------------------- concept room -- */

function dxReview(conceptId, fnId) {
  return DX.reviews[`${conceptId}:${fnId}`] || null;
}

function dxRoom(concept = dxConcept()) {
  const mode = wsReviewMode();
  const validation = dxValidation(concept);
  const baseRounds = { sequential: 3.4, async: 2.1, threshold: 1.3 }[mode.id];
  const baseDays = { sequential: 15, async: 7, threshold: 4 }[mode.id];
  const set = DX_FUNCTIONS.map((fn) => {
    const chosen = dxReview(concept.id, fn.id);
    const evidence = {
      design: validation.rows.find((r) => r.id === "brand"),
      merch: validation.rows.find((r) => r.id === "demand"),
      mktg: validation.rows.find((r) => r.id === "relevance"),
      comm: validation.rows.find((r) => r.id === "risk")
    }[fn.id];
    const prereadVerdict = evidence.invert
      ? (evidence.value <= 0.35 ? "approve" : evidence.value <= 0.55 ? "flag" : "hold")
      : (evidence.value >= 0.68 ? "approve" : evidence.value >= 0.5 ? "flag" : "hold");
    return { fn, evidence, prereadVerdict, chosen };
  });
  const decided = set.filter((s) => s.chosen);
  const extra = decided.reduce((sum, s) => sum + (DX_VERDICTS.find((v) => v.id === s.chosen)?.rounds || 0), 0);
  const rounds = baseRounds + extra * (mode.id === "threshold" ? 0.6 : 1);
  const days = baseDays + extra * (mode.id === "threshold" ? 1.5 : 3);
  const allIn = decided.length === DX_FUNCTIONS.length;
  const unanimous = allIn && decided.every((s) => s.chosen === "approve");
  const conflicts = [];
  if (decided.some((s) => s.chosen === "approve") && decided.some((s) => s.chosen === "hold")) {
    conflicts.push("Design and Commercial are not reading the same risk. The model raises this rather than averaging it away.");
  }
  if (validation.rows.find((r) => r.id === "brand").value < 0.55 && decided.some((s) => s.fn.id === "merch" && s.chosen === "approve")) {
    conflicts.push("Merchandising has approved a concept that sits below the brand fit guardrail. This escalates to the Design Director.");
  }
  if (validation.rows.find((r) => r.id === "deadstock").value > 0.55 && dxCut(concept.id) !== "short") {
    conflicts.push("Deadstock exposure is above the threshold for a cut this size. Commercial can approve only against a named recut window.");
  }
  const autoApproved = mode.id === "threshold" && unanimous && validation.score >= 0.62 && !conflicts.length;
  return { mode, set, rounds, days, decided, allIn, unanimous, conflicts, autoApproved, validation };
}

/* ----------------------------------------------------------- refinement -- */

function dxArtefacts(concept = dxConcept()) {
  const level = wsEffectiveAutonomy();
  const modified = DX_ELEMENTS.filter((e) => dxElementState(concept.id, e.id) === "modify").length;
  const version = `1.${DX.pass - 1}.${modified}`;
  return {
    version,
    rows: [
      { name: "Technical pack", by: level >= 2 ? "Generated" : "Manual", from: "Approved concept record", now: "4.9 hrs", after: level >= 2 ? "0.6 hrs on final check" : "4.9 hrs" },
      { name: "Specification sheet", by: level >= 2 ? "Generated" : "Manual", from: "Element decisions and fabric record", now: "2.4 hrs", after: level >= 2 ? "0.3 hrs" : "2.4 hrs" },
      { name: "Bill of materials", by: level >= 2 ? "Generated" : "Manual", from: "Fabric and trim selections", now: "1.8 hrs", after: level >= 2 ? "0.4 hrs" : "1.8 hrs" },
      { name: "Size set and grading notes", by: "Human led", from: "Pattern room", now: "3.0 hrs", after: "3.0 hrs" },
      { name: "Care, fibre and compliance label", by: level >= 1 ? "Generated, technologist signs" : "Manual", from: "Material profile and mill certificates", now: "1.1 hrs", after: level >= 1 ? "0.4 hrs" : "1.1 hrs" },
      { name: "Version history and change log", by: "Generated", from: "Every element decision on this concept", now: "0.9 hrs", after: "0 hrs, written as it happens" }
    ]
  };
}

function dxHumanShare(concept = dxConcept()) {
  const total = DX_ELEMENTS.length;
  const touched = DX_ELEMENTS.filter((e) => ["modify", "reject"].includes(dxElementState(concept.id, e.id))).length;
  const level = wsEffectiveAutonomy();
  const floor = [1, 0.86, 0.68, 0.54][level];
  const decisions = Object.keys(DX.reviews).filter((k) => k.startsWith(`${concept.id}:`)).length;
  return clamp01(floor + (touched / total) * (1 - floor) * 0.9 + (DX.approved[concept.id] ? 0.04 : 0) + decisions * 0.01);
}

/* ================================================================ pages == */

function dxPill(value, invert = false) {
  const good = invert ? value <= 0.35 : value >= 0.66;
  const mid = invert ? value <= 0.55 : value >= 0.5;
  return good ? "ok" : mid ? "warn" : "stop";
}

function dxScoreBar(row) {
  const tone = dxPill(row.value, row.invert);
  return `<div class="dx-score-row">
    <span class="dx-score-label">${escapeHTML(row.label)}</span>
    <span class="dx-score-track"><span class="dx-score-fill tone-${tone}" style="width:${Math.round(row.value * 100)}%"></span></span>
    <strong class="dx-score-value tone-${tone}">${Math.round(row.value * 100)}${row.invert ? "% risk" : "%"}</strong>
    <span class="dx-score-note">${escapeHTML(row.note)}</span>
  </div>`;
}

/* Fourteen weeks down to the configured total, stage by stage. */
function dxWaterfall(cycle) {
  const width = 760;
  const height = 260;
  const left = 46;
  const right = 20;
  const top = 26;
  const bottom = 58;
  const span = width - left - right;
  const slot = span / (cycle.stages.length + 2);
  const maxV = 14.5;
  const y = (v) => top + (1 - v / maxV) * (height - top - bottom);
  let running = 14;
  const bars = [];
  bars.push({ label: "Today", from: 0, to: 14, kind: "total" });
  const shortName = { trend: "Research", concept: "Concept", review: "Review", refine: "Refinement", production: "Production" };
  cycle.stages.forEach((stage) => {
    const drop = stage.saved;
    bars.push({ label: shortName[stage.id] || stage.name, from: running - drop, to: running, kind: drop > 0.02 ? "cut" : "flat", drop });
    running -= drop;
  });
  bars.push({ label: "Configured", from: 0, to: running, kind: cycle.pass ? "pass" : "miss" });
  const fill = { total: PWC.deep, cut: PWC.purple, flat: PWC.grey, pass: "#8A6D1F", miss: PWC.amber };
  return `<div class="viz-card"><h4>Where the weeks actually come from</h4><p>Each drop is one stage. The floor under each bar is what the case says cannot move.</p>
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Waterfall of weeks removed by stage">
      ${[0, 4, 8, 12, 14].map((v) => `<line x1="${left}" y1="${y(v)}" x2="${width - right}" y2="${y(v)}" stroke="${PWC.rule}"/><text x="${left - 8}" y="${y(v) + 3.5}" text-anchor="end" font-size="9.5" fill="${PWC.quiet}">${v}</text>`).join("")}
      <line x1="${left}" y1="${y(8)}" x2="${width - right}" y2="${y(8)}" stroke="${PWC.rose}" stroke-dasharray="5 4"/>
      <text x="${left + span * 0.42}" y="${y(8) - 7}" text-anchor="middle" font-size="10" font-weight="600" fill="${PWC.rose}">8 week target</text>
      ${bars.map((bar, index) => {
        const x = left + slot * index + slot * 0.18;
        const w = slot * 0.64;
        const yTop = y(bar.to);
        const h = Math.max(2, y(bar.from) - y(bar.to));
        return `<g><rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${fill[bar.kind]}"><title>${escapeHTML(bar.label)}: ${bar.kind === "cut" ? `${bar.drop.toFixed(1)} wks removed` : `${bar.to.toFixed(1)} wks`}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(yTop - 6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="${PWC.ink}">${bar.kind === "cut" ? (bar.drop > 0.05 ? `−${bar.drop.toFixed(1)}` : "0") : bar.to.toFixed(1)}</text>
        <text x="${(x + w / 2).toFixed(1)}" y="${height - 34}" text-anchor="middle" font-size="9.5" fill="${PWC.muted}">${escapeHTML(bar.label)}</text></g>`;
      }).join("")}
      <text x="${left}" y="${height - 12}" font-size="10" fill="${PWC.quiet}">Weeks per collection, from first signal to handover</text>
    </svg>
    <div class="viz-legend"><span><i style="background:${PWC.deep}"></i>Fourteen weeks today</span><span><i style="background:${PWC.purple}"></i>Weeks removed at this setting</span><span><i style="background:${PWC.grey}"></i>Stage that did not move</span><span><i style="background:${cycle.pass ? "#8A6D1F" : PWC.amber}"></i>Configured cycle</span></div>
    <div class="viz-caption"><strong>How to read it.</strong> Read left to right. Every drop has a named mechanism in the table below, and every stage stops at a floor that a person, a supplier or a contract sets.</div>
  </div>`;
}

function dxValidationChart(concepts) {
  const width = 720;
  const rowH = 30;
  const groups = concepts.map((c) => ({ c, v: dxValidation(c) }));
  const criteria = ["relevance", "customer", "brand", "demand", "price"];
  const height = criteria.length * rowH + 62;
  const left = 168;
  const span = width - left - 120;
  const colors = [PWC.purple, PWC.deep, PWC.tangerine];
  return `<div class="viz-card"><h4>The directions side by side</h4><p>Same five commercial criteria, scored for each direction the copilot drafted.</p>
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Commercial screen by direction">
      ${criteria.map((key, rowIndex) => {
        const y0 = 22 + rowIndex * rowH;
        const label = groups[0].v.rows.find((r) => r.id === key).label;
        const bw = Math.max(5, (rowH - 12) / Math.max(1, groups.length));
        return `<text x="${left - 10}" y="${y0 + 12}" text-anchor="end" font-size="10.5" fill="${PWC.ink}">${escapeHTML(label)}</text>
        ${groups.map((g, i) => {
          const v = g.v.rows.find((r) => r.id === key).value;
          const y = y0 + i * (bw + 1.5);
          return `<rect x="${left}" y="${y}" width="${(v * span).toFixed(1)}" height="${bw.toFixed(1)}" rx="1.5" fill="${colors[i]}"><title>${escapeHTML(g.c.dir.word)} · ${escapeHTML(label)}: ${Math.round(v * 100)}%</title></rect>
          <text x="${(left + v * span + 5).toFixed(1)}" y="${(y + bw - 0.5).toFixed(1)}" font-size="9" font-weight="600" fill="${PWC.muted}">${Math.round(v * 100)}</text>`;
        }).join("")}`;
      }).join("")}
      <line x1="${left + span * 0.6}" y1="14" x2="${left + span * 0.6}" y2="${height - 34}" stroke="${PWC.rose}" stroke-dasharray="4 4"/>
      <text x="${left + span * 0.6 + 5}" y="12" font-size="9.5" font-weight="600" fill="${PWC.rose}">60% screen line</text>

    <div class="viz-caption"><strong>How to read it.</strong> A direction clears the screen when the commercial criteria sit right of the line and the two risk measures stay low. Moving AI involvement, the signal set or the brand redraws every bar.</div>
  </div>`;
}

        <button type="button" class="primary-btn" data-dx-approve="${concept.id}" ${DX.approved[concept.id] || (!room.allIn && !room.autoApproved) ? "disabled" : ""}>${DX.approved[concept.id] ? `Signed by ${escapeHTML(DX.approved[concept.id].by)}` : room.autoApproved ? "Confirm the auto approval" : "Sign the concept record"}</button>

      </div>
    </div>
    <div class="rule-panel"><h4>What the review model changes</h4><p>The same four opinions, arranged three different ways.</p>
      ${renderBars(WS_REVIEW_MODES.map((m) => ({ label: `${m.label}${m.id === mode.id ? " · current" : ""}`, value: { sequential: 15, async: 7, threshold: 4 }[m.id], tone: m.id === mode.id ? "blue" : "graphite" })), (v) => `${v} days`)}

        <div class="kv-row"><span>Approval path</span><strong>${mode.id === "threshold" ? "Auto approval inside guardrails, exceptions escalate" : mode.id === "async" ? "One decision meeting at the end" : "Serial meetings, one per function"}</strong></div>

  </section>
  <div class="assumption-note">Assumptions: baseline of 3.4 review rounds and 15 working days is a modelled estimate from the three week cross functional stage in Exhibit 1. Round and day reductions for the shared room and for threshold approvals are stated design assumptions; each recorded flag or hold adds rounds to the live figure. Pre read verdicts are generated from the commercial screen on this page.</div>`;
}

/* Refinement and the decision trail. */

  const savedHours = artefacts.rows.reduce((sum, row) => {

  return `
  <section class="page-section">
    <div class="page-section-header"><div><h2 class="page-section-title">Product refinement</h2><p>Documentation written from the approved concept record rather than retyped from it.</p></div><span class="mono">${escapeHTML(concept.dir.word)} · v${escapeHTML(artefacts.version)}</span></div>
    ${!approved ? `<div class="human-gate"><i class="ti ti-lock" aria-hidden="true"></i><span><strong>The concept record is not signed yet.</strong> Refinement artefacts are generated from a signed record, not before it, so the provenance chain has no gap. Record the four verdicts in the concept room and sign it there.</span></div>` : ""}
    <div class="ws-table-wrap"><table class="ws-table">
      <thead><tr><th>Artefact</th><th>Produced by</th><th>Drawn from</th><th>Today</th><th>At this setting</th></tr></thead>
      <tbody>${artefacts.rows.map((row) => `<tr><td><strong>${escapeHTML(row.name)}</strong></td><td><span class="taxo-tag ${row.by === "Human led" ? "human" : row.by.startsWith("Generated") ? "automate" : "augment"}">${escapeHTML(row.by)}</span></td><td>${escapeHTML(row.from)}</td><td>${escapeHTML(row.now)}</td><td><strong>${escapeHTML(row.after)}</strong></td></tr>`).join("")}</tbody>
    </table></div>
    <div class="dx-actions-row">
      <button type="button" class="primary-btn" data-dx-pack="${concept.id}" ${!approved || packed ? "disabled" : ""}>${packed ? `Tech pack ${escapeHTML(packed.id)} issued` : "Generate the tech pack"}</button>
      <span class="dx-inline-note">${savedHours.toFixed(1)} hours of documentation released per concept at this setting.</span>

        <div class="kv-row"><span>Elements edited by the designer</span><strong>${DX_ELEMENTS.filter((e) => dxElementState(concept.id, e.id) === "modify").length} of ${DX_ELEMENTS.length}</strong></div>
        <div class="kv-row"><span>Elements rejected</span><strong>${DX_ELEMENTS.filter((e) => dxElementState(concept.id, e.id) === "reject").length}</strong></div>

      </div>

      <div class="dx-contrib"><div class="dx-contrib-track"><span style="width:${Math.round(human * 100)}%"></span></div><strong>${Math.round(human * 100)}%</strong></div>
      <div class="kv-list">

function dxTrailSection(concept, trend, brand) {

/* Review load across the three models, with the live position marked. */
function dxRoomChart(room) {
  const width = 700;
  const height = 236;
  const left = 150;
  const bottom = 44;
  const top = 24;
  const span = width - left - 96;
  const models = WS_REVIEW_MODES.map((mode) => ({
    mode,
    rounds: { sequential: 3.4, async: 2.1, threshold: 1.3 }[mode.id],
    days: { sequential: 15, async: 7, threshold: 4 }[mode.id]
  }));
  const maxDays = 20;
  const rowH = 56;
  return `<div class="viz-card"><h4>What the review model costs in rounds and in days</h4><p>Three arrangements of the same four opinions. The marker is where this session currently sits, including every flag and hold recorded above.</p>
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Review rounds and elapsed days by review model">
      ${[0, 5, 10, 15, 20].map((d) => `<line x1="${left + (d / maxDays) * span}" y1="${top - 6}" x2="${left + (d / maxDays) * span}" y2="${height - bottom + 6}" stroke="${PWC.rule}"/><text x="${left + (d / maxDays) * span}" y="${height - bottom + 22}" text-anchor="middle" font-size="9.5" fill="${PWC.quiet}">${d}</text>`).join("")}
      ${models.map((m, i) => {
        const y = top + i * rowH;
        const isLive = m.mode.id === room.mode.id;
        const w = (m.days / maxDays) * span;
        const liveW = (room.days / maxDays) * span;
        return `<g>
          <text x="${left - 12}" y="${y + 14}" text-anchor="end" font-size="11" font-weight="${isLive ? 700 : 500}" fill="${PWC.ink}">${escapeHTML(m.mode.label)}</text>
          <text x="${left - 12}" y="${y + 28}" text-anchor="end" font-size="9.5" fill="${PWC.quiet}">${m.rounds.toFixed(1)} rounds</text>
          <rect x="${left}" y="${y + 2}" width="${w.toFixed(1)}" height="18" rx="2.5" fill="${isLive ? PWC.purple : PWC.grey}"><title>${escapeHTML(m.mode.label)}: ${m.days} working days</title></rect>
          <text x="${(left + w + 7).toFixed(1)}" y="${y + 15}" font-size="10.5" font-weight="650" fill="${PWC.muted}">${m.days} days</text>
          ${isLive && Math.abs(liveW - w) > 1 ? `<rect x="${(left + w).toFixed(1)}" y="${y + 2}" width="${Math.max(0, liveW - w).toFixed(1)}" height="18" rx="2.5" fill="${PWC.amber}" opacity="0.85"><title>Added by recorded flags and holds</title></rect>
          <text x="${(left + liveW + 7).toFixed(1)}" y="${y + 15}" font-size="10.5" font-weight="700" fill="${PWC.amber}">${room.days.toFixed(0)} live</text>` : ""}
        </g>`;
      }).join("")}
      <text x="${left}" y="${height - 8}" font-size="9.5" fill="${PWC.quiet}">Working days from concept circulated to decision recorded</text>
    </svg>
    <div class="viz-legend"><span><i style="background:${PWC.purple}"></i>Review model in force</span><span><i style="background:${PWC.grey}"></i>The other two arrangements</span><span><i style="background:${PWC.amber}"></i>Added by the flags and holds recorded in this session</span></div>
    <div class="viz-caption"><strong>Rounds are the cost, not meetings.</strong> Each flag recorded above adds a round and the days move with it, which is why the consolidation matters more than the meeting calendar.</div>
  </div>`;
}

/* Documentation hours per concept, today against this setting. */
function dxDocChart(artefacts) {
  const width = 700;
  const rowH = 32;
  const rows = artefacts.rows.map((row) => ({ name: row.name, now: parseFloat(row.now) || 0, after: parseFloat(row.after) || 0, by: row.by }));
  const height = rows.length * rowH + 52;
  const left = 196;
  const span = width - left - 92;
  const max = Math.max(...rows.map((r) => r.now), 1);
  const savedTotal = rows.reduce((sum, r) => sum + Math.max(0, r.now - r.after), 0);
  return `<div class="viz-card"><h4>Documentation hours per concept</h4><p>Exhibit 2 puts documentation and presentation preparation at 12% of the designer week. This is that 12%, artefact by artefact.</p>
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Documentation hours per artefact, today against this setting">
      ${rows.map((row, i) => {
        const y = 20 + i * rowH;
        const wNow = (row.now / max) * span;
        const wAfter = (row.after / max) * span;
        return `<g>
          <text x="${left - 10}" y="${y + 13}" text-anchor="end" font-size="10.5" fill="${PWC.ink}">${escapeHTML(row.name)}</text>
          <rect x="${left}" y="${y}" width="${wNow.toFixed(1)}" height="9" rx="1.5" fill="${PWC.grey}"><title>Today: ${row.now} hrs</title></rect>
          <rect x="${left}" y="${y + 11}" width="${Math.max(1.5, wAfter).toFixed(1)}" height="9" rx="1.5" fill="${row.by === "Human led" ? PWC.deep : PWC.purple}"><title>At this setting: ${row.after} hrs</title></rect>
          <text x="${(left + Math.max(wNow, wAfter) + 7).toFixed(1)}" y="${y + 16}" font-size="10" font-weight="650" fill="${row.now - row.after > 0.05 ? PWC.purple : PWC.quiet}">${row.now - row.after > 0.05 ? `−${(row.now - row.after).toFixed(1)} hrs` : "held"}</text>
        </g>`;
      }).join("")}
      <text x="${left}" y="${height - 12}" font-size="9.5" fill="${PWC.quiet}">Hours per concept · upper bar today, lower bar at this setting</text>
    </svg>
    <div class="viz-legend"><span><i style="background:${PWC.grey}"></i>Today</span><span><i style="background:${PWC.purple}"></i>Generated from the concept record</span><span><i style="background:${PWC.deep}"></i>Stays human led</span></div>
    <div class="viz-caption"><strong>${savedTotal.toFixed(1)} hours a concept.</strong> Across twelve collections this is the single largest block of released time, and it is released by not retyping what the record already holds.</div>
  </div>`;
}

/* The five decisions a judge should watch happen, in order. */
function dxDemoPath() {
  const concept = dxConcept();
  const level = wsEffectiveAutonomy();
  const edited = DX_ELEMENTS.filter((el) => ["modify", "reject"].includes(dxElementState(concept.id, el.id))).length;
  const commercial = dxReview(concept.id, "comm");
  const capture = dxCapture(concept);
  const complete = capture.every((row) => row.got === row.of);
  const steps = [
    { n: "01", name: "AI proposes", page: "copilot", done: level >= 1, note: level >= 1 ? `${dxConcepts().length} direction${dxConcepts().length === 1 ? "" : "s"} drafted from brief ${escapeHTML(WS.trend)}` : "AI involvement is switched off" },
    { n: "02", name: "Designer modifies", page: "copilot", done: edited > 0, note: edited ? `${edited} element${edited > 1 ? "s" : ""} edited or rejected by the designer` : "No element decision recorded yet" },
    { n: "03", name: "Commercial reviews", page: "room", done: Boolean(commercial), note: commercial ? `Commercial recorded ${escapeHTML(DX_VERDICTS.find((v) => v.id === commercial).label.toLowerCase())}` : "Commercial has not taken a position yet" },
    { n: "04", name: "Human approves", page: "room", done: Boolean(DX.approved[concept.id]), note: DX.approved[concept.id] ? `Signed by ${escapeHTML(DX.approved[concept.id].by)}` : "The concept record is still open" },
    { n: "05", name: "IP record created", page: "trust", done: complete, note: complete ? "Every capture point has fired" : `${capture.filter((row) => row.got === row.of).length} of ${capture.length} capture points complete` }
  ];
  const done = steps.filter((step) => step.done).length;
  return `<div class="viz-card"><h4>The decision chain, live</h4><p>AI proposes, the designer decides, the functions review, a named person approves, and the record writes itself. Walk it left to right; each marker fills as the decision is actually taken in this session.</p>
    <div class="dx-path">${steps.map((step) => `<button type="button" class="dx-path-step ${step.done ? "is-done" : ""}" data-page="${step.page}">
      <span class="dx-path-mark">${step.done ? "&#10003;" : step.n}</span>
      <strong>${escapeHTML(step.name)}</strong>
      <em>${step.note}</em>
    </button>`).join("<span class=\"dx-path-link\" aria-hidden=\"true\"></span>")}</div>
    <div class="viz-caption"><strong>${done} of 5 taken in this session.</strong> Nothing here is narrated. Each step is a control on a working screen, and until a human takes it the concept cannot reach production readiness.</div>
  </div>`;
}

/* Capture points on the live concept, shared by the trail, the trust page
   and the production gate so all three read from one definition. */
function dxCapture(concept = dxConcept()) {
  const level = wsEffectiveAutonomy();
  const connected = WS_SIGNALS.filter((sig) => WS.signals[sig.id]);
  const chain = ["trend-rank v4.2"]
    .concat(level >= 2 ? ["brief-gen v2.1"] : [])
    .concat(level >= 3 ? ["doc-gen v1.4", "consolidate v1.1"] : [])
    .join(" · ");
  const mode = wsReviewMode();
  return [
    { label: "Signal sources and retrieval times", got: connected.length, of: WS_SIGNALS.length, note: connected.map((sig) => sig.label).join(", ") || "no live source" },
    { label: "Model name, version and prompt", got: level >= 1 ? 1 : 0, of: 1, note: level >= 1 ? chain : "No model in the chain at this setting" },
    { label: "Human edit and reason code", got: DX_ELEMENTS.filter((el) => dxElementState(concept.id, el.id) !== "open").length, of: DX_ELEMENTS.length, note: "Captured as the designer decides on each element" },
    { label: "Cross functional positions", got: DX_FUNCTIONS.filter((fn) => dxReview(concept.id, fn.id)).length, of: DX_FUNCTIONS.length, note: `${mode.label}. ${mode.note}` },
    { label: "Named approver and decision time", got: DX.approved[concept.id] ? 1 : 0, of: 1, note: DX.approved[concept.id] ? `${DX.approved[concept.id].by} at ${DX.approved[concept.id].at}` : "Record is still open" }
  ];
}

/* Where the journey ends, per the case: production readiness. */
function dxHandoff(concept = dxConcept()) {
  const capture = dxCapture(concept);
  const complete = capture.every((row) => row.got === row.of);
  const commercial = dxReview(concept.id, "comm") === "approve";
  const gates = [
    { label: "Tech pack issued", ok: Boolean(DX.packs[concept.id]), detail: DX.packs[concept.id] ? `${DX.packs[concept.id].id} at ${DX.packs[concept.id].at}` : "Generate it above once the record is signed", page: "refine" },
    { label: "Human approval on the concept", ok: Boolean(DX.approved[concept.id]), detail: DX.approved[concept.id] ? `${DX.approved[concept.id].by}` : "Sign the record in the concept room", page: "room" },
    { label: "Commercial approval", ok: commercial, detail: commercial ? "Commercial recorded an approve position" : "Commercial has not approved this concept", page: "room" },
    { label: "IP and provenance record complete", ok: complete, detail: complete ? "All five capture points have fired" : `${capture.filter((row) => row.got === row.of).length} of ${capture.length} capture points complete`, page: "trust" }
  ];
  const cleared = gates.filter((gate) => gate.ok).length;
  const ready = cleared === gates.length;
  const handed = DX.handoff[concept.id];
  const cycle = wsCycle();

}

/* One picture that says this workstream does not operate in isolation. */
function dxDownstream() {
  const cycle = wsCycle();
  const saved = 14 - cycle.total;
  const chain = [
    { name: "Design Intelligence", page: "journey", gets: "Ranked briefs with a source behind every line, a signed concept record, and a dated launch window." },
    { name: "Merchandising", page: "copilot", gets: `Demand evidence ${saved.toFixed(1)} weeks earlier, and a first cut sized to live confidence rather than to the seasonal plan.` },
    { name: "Marketing", page: "room", gets: "Launch dates it can build a campaign calendar around, and a story drawn from the brief rather than reconstructed from a deck." },
    { name: "Retail operations", page: "overview", gets: "A short cycle is what makes reserved recut capacity worth buying. The control tower is where that shows up." },
    { name: "Customer experience", page: "margin", gets: "Product on the floor while the trend is still rising, fewer markdowns, and fit issues caught in reviews before the cut." }
  ];
  return `<div class="viz-card"><h4>This workstream does not operate in isolation</h4><p>The case is explicit that faster design changes merchandising decisions, campaign timelines and retail allocation. Each link below opens the screen where that effect is visible.</p>
    <div class="dx-chain">${chain.map((node, index) => `<button type="button" class="dx-chain-node ${index === 0 ? "is-source" : ""}" data-page="${node.page}">
      <span class="dx-chain-index">${String(index + 1).padStart(2, "0")}</span>
      <strong>${escapeHTML(node.name)}</strong>

    </button>`).join("<span class=\"dx-chain-arrow\" aria-hidden=\"true\">↓</span>")}</div>

}

/* ------------------------------------------------------------- wiring --- */

function dxWireEvents() {
  document.querySelectorAll("[data-dx-concept]").forEach((button) => button.addEventListener("click", () => {
    DX.concept = button.dataset.dxConcept;
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-dx-element]").forEach((button) => button.addEventListener("click", () => {
    const [conceptId, elementId, state] = button.dataset.dxElement.split(":");
    const key = `${conceptId}:${elementId}`;
    const already = DX.elements[key] === state;
    if (already) { delete DX.elements[key]; }
    else { DX.elements[key] = state; }
    const label = DX_ELEMENTS.find((e) => e.id === elementId).label;
    dxLog("Designer", already ? `Decision withdrawn on ${label.toLowerCase()}` : `${state === "accept" ? "Accepted" : state === "modify" ? "Modified" : "Rejected"} the ${label.toLowerCase()}`,
      already ? "The element returns to open and the record reopens." :
      state === "accept" ? "Taken as drafted. Origin stays with the model on the concept record." :
      state === "modify" ? "Designer edit recorded. Authorship on this element transfers to the designer." :
      "Rejected with a reason code, which is fed back into theme ranking.", conceptId);
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-dx-cut]").forEach((button) => button.addEventListener("click", () => {
    const [conceptId, cutId] = button.dataset.dxCut.split(":");
    DX.cut[conceptId] = cutId;
    const cut = DX_CUTS.find((c) => c.id === cutId);
    dxLog("Designer", `Committed a ${cut.label.toLowerCase()}`, `${cut.note} Deadstock exposure and commercial risk are rescored against the new volume.`, conceptId);
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-dx-regen]").forEach((button) => button.addEventListener("click", () => {
    DX.pass += 1;
    dxLog("Agent", `Redrafted the directions, pass ${DX.pass}`, "Requested by the designer. The previous pass stays on the record; it is not overwritten.");
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-dx-reset-concept]").forEach((button) => button.addEventListener("click", () => {
    DX_ELEMENTS.forEach((e) => delete DX.elements[`${DX.concept}:${e.id}`]);
    dxLog("Designer", "Cleared the decisions on this direction", "Element decisions reset. The events that produced them stay on the trail.");
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-dx-review]").forEach((button) => button.addEventListener("click", () => {
    const [conceptId, fnId, verdict] = button.dataset.dxReview.split(":");
    const key = `${conceptId}:${fnId}`;
    const already = DX.reviews[key] === verdict;
    if (already) delete DX.reviews[key]; else DX.reviews[key] = verdict;
    const fn = DX_FUNCTIONS.find((f) => f.id === fnId);
    dxLog("Reviewer", `${fn.name} ${already ? "withdrew its position" : DX_VERDICTS.find((v) => v.id === verdict).label.toLowerCase()}`,
      already ? "The lane returns to open and the consolidation is rewritten." : `Recorded against ${fn.name}. The model rewrites the consolidated position and the round count.`, conceptId);
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-dx-clear-room]").forEach((button) => button.addEventListener("click", () => {
    const conceptId = button.dataset.dxClearRoom;
    DX_FUNCTIONS.forEach((f) => delete DX.reviews[`${conceptId}:${f.id}`]);
    delete DX.approved[conceptId];
    dxLog("Reviewer", "Room cleared", "All four lanes reopened and the signature on this concept withdrawn.", conceptId);
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-dx-approve]").forEach((button) => button.addEventListener("click", () => {
    const conceptId = button.dataset.dxApprove;
    if (DX.approved[conceptId]) return;
    const approver = { SPD: "R. Menon, Design Director", URB: "N. Dsouza, Design Director", MSN: "S. Aiyar, Atelier Head", ECO: "P. Varma, Head of Product", THR: "K. Iyer, Design Lead" }[WS.brand] || "R. Menon, Design Director";
    DX.approved[conceptId] = { by: approver, at: dxStamp() };
    dxLog("Approver", "Concept record signed", `${approver} signed the record. Model versions, source timestamps, every human edit and the four review positions are sealed into the entry.`, conceptId);
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-dx-handoff]").forEach((button) => button.addEventListener("click", () => {
    const conceptId = button.dataset.dxHandoff;
    if (DX.handoff[conceptId]) return;
    const id = `PO-2026-${String(1200 + DX.clock).padStart(4, "0")}`;
    DX.handoff[conceptId] = { id, at: dxStamp() };
    dxLog("Approver", `Released to manufacturing as ${id}`, "Tech pack, signed concept record, commercial approval and the complete provenance record released to the supplier. Production readiness starts here and is held by fabric and capacity, not by this workstream.", conceptId);
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-dx-pack]").forEach((button) => button.addEventListener("click", () => {
    const conceptId = button.dataset.dxPack;
    if (DX.packs[conceptId]) return;
    const id = `TP-2026-${String(400 + DX.clock).padStart(4, "0")}`;
    DX.packs[conceptId] = { id, at: dxStamp() };
    dxLog("Agent", `Tech pack ${id} generated`, "Specification, bill of materials, care and fibre label and change log written from the signed concept record. The technologist signs the fibre claim before it leaves.", conceptId);
    render({ preserveScroll: true });
  }));
}

function wsTrendPage() {
  const brand = wsBrand();
  const active = WS_TRENDS.find((trend) => trend.id === WS.trend) || WS_TRENDS[0];
  const coverage = wsSignalCoverage();
  const cards = WS_TRENDS.map((trend) => {
    const evidence = trend.srcs.filter((source) => WS.signals[source]);
    const confidence = trend.conf * (0.45 + 0.55 * coverage) * (evidence.length / Math.max(1, trend.srcs.length));
    return { trend, confidence, evidence };
  }).sort((a, b) => b.confidence * b.trend.momentum - a.confidence * a.trend.momentum);

  const grid = cards.map(({ trend, confidence, evidence }) => `<button type="button" class="trend-card ${WS.trend === trend.id ? "active" : ""}" data-ws-trend="${trend.id}">
      <div class="trend-card-top"><strong>${escapeHTML(trend.name)}</strong><span class="trend-momentum">+${trend.momentum}%</span></div>
      <div class="trend-meta">${trend.cats.map((category) => `<span class="trend-tag">${escapeHTML(category)}</span>`).join("")}${trend.brands.includes(brand.id) ? `<span class="trend-tag brand">${escapeHTML(brand.name)} fit</span>` : ""}</div>
      ${wsSpark(wsTrendSeries(trend), trend.brands.includes(brand.id) ? PWC.purple : PWC.grey)}
      <div class="trend-confidence"><span class="mono">${trend.id}</span><span class="trend-confidence-track"><span class="trend-confidence-fill" style="width:${Math.round(confidence * 100)}%"></span></span><span>${confidence.toFixed(2)}</span></div>
      <div class="trend-confidence"><span>${evidence.length} of ${trend.srcs.length} sources · peaks in ${trend.peak} wks</span></div>
    </button>`).join("");

  const activeCard = cards.find((card) => card.trend.id === active.id) || cards[0];
  const usable = activeCard.confidence >= 0.6;

  return `${wsHeadline()}
  <section class="page-section">${wsTrendScatter(cards)}</section>
  <section class="page-section">
    <div class="page-section-header"><div><h2 class="page-section-title">Ranked for ${escapeHTML(brand.name)}</h2><p>Six source families, read every six hours, ranked for ${escapeHTML(brand.name)}.</p></div><span class="mono">${WS_TRENDS.length} live themes</span></div>
    <div class="trend-grid">${grid}</div>
  </section>
  <section class="page-grid-2">
    ${wsBriefSheet(active, activeCard.confidence, usable)}
    <div class="rule-panel">
      <h4>Signal weighting</h4>
      <p>Exhibit 1 puts this stage at three weeks, spread across disconnected sources.</p>
      ${renderBars(WS_SIGNALS.map((signal) => ({ label: signal.label, value: WS.signals[signal.id] ? Math.round(signal.weight * 100) : 0, tone: WS.signals[signal.id] ? "blue" : "graphite" })), (value) => `${value}%`)}
      <div class="readout"><strong>Sell through anchors the ranking.</strong> A loud social signal with no commercial evidence cannot lead a brief.</div>
      <div class="kv-list">
        <div class="kv-row"><span>Sweep frequency</span><strong>Every 6 hours</strong></div>
        <div class="kv-row"><span>Designer hours removed per collection</span><strong>${Math.round(1180 * wsDriverFactor("signal", brand) * 0.72)} hrs</strong></div>
        <div class="kv-row"><span>Themes surfaced per brand per month</span><strong>18 to 24</strong></div>
        <div class="kv-row"><span>Confidence floor for commitment</span><strong>0.60</strong></div>
      </div>
    </div>
  </section>
  <section class="page-section">

    <div class="ws-table-wrap"><table class="ws-table">
      <thead><tr><th>Source family</th><th>State</th><th>Weight in ranking</th><th>What it is read for</th><th>Themes it evidences now</th></tr></thead>
      <tbody>${WS_SIGNALS.map((signal) => {
        const on = WS.signals[signal.id];

        const count = WS_TRENDS.filter((trend) => trend.srcs.includes(signal.id)).length;

function wsKpiNow(row, cycle, mix) {
  // Only the KPIs the model actually derives get a live reading. Everything
  // else is observed in operation and is not inferred from these settings.
  if (row.kpi === "Trend-to-store cycle") {
    return { text: `${cycle.total.toFixed(1)} wks`, pass: cycle.total < 8 };
  }
  if (row.kpi === "Designer creative time") {
    const pct = Math.round(mix.creative * 100);
    return { text: `${pct}%`, pass: mix.creative >= 0.6 };
  }
  if (row.kpi === "Research hours per collection") {
    // 1,180 hrs sits against the 36% research share in Exhibit 2, so the live
    // figure scales with whatever the activity mix now leaves in research.
    const after = mix.rows
      .filter((r) => r.driver === "signal")
      .reduce((sum, r) => sum + r.after, 0);
    const hrs = Math.round(1180 * (after / 0.36));
    return { text: `${hrs.toLocaleString()} hrs`, pass: hrs < 350 };
  }
  if (row.kpi === "Concept approval time") {
    // This is the cross-functional reviews stage from Exhibit 1, in working days.
    const reviews = cycle.stages.find((stage) => stage.id === "review");
    if (!reviews) return null;
    const days = reviews.after * 5;
    return { text: `${days.toFixed(1)} days`, pass: days <= 4 };
  }
  return null;
}

/* Keeps chart labels off each other: pushes a colliding label above or below. */
function wsLabelPlacer() {
  const placed = [];
  return function place(cx, cy, radius, text, size = 10.5) {
    const halfWidth = (text.length * size * 0.52) / 2;
    const candidates = [cy - radius - 7, cy + radius + 15, cy - radius - 21, cy + radius + 29, cy - radius - 35];
    let y = candidates[0];
    for (const option of candidates) {
      const clash = placed.some((item) => Math.abs(item.y - option) < 13 && Math.abs(item.x - cx) < item.half + halfWidth + 6);
      if (!clash) { y = option; break; }
      y = option;
    }
    placed.push({ x: cx, y, half: halfWidth });
    return y;
  };
}

function wsSpark(values, color = PWC.purple) {
  const width = 120;
  const height = 26;
  const max = Math.max(...values);
  const min = Math.min(...values);
  const points = values.map((value, index) => [
    (index / (values.length - 1)) * width,
    height - 2 - ((value - min) / Math.max(0.001, max - min)) * (height - 6)
  ]);
  const area = `${linePath(points)} L${width} ${height} L0 ${height} Z`;
  return `<svg class="spark" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" fill="${color}" opacity="0.12"/><path d="${linePath(points)}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${points[points.length - 1][0] - 1}" cy="${points[points.length - 1][1]}" r="2.2" fill="${color}"/></svg>`;
}

function wsTrendSeries(trend) {
  const random = rng(trend.momentum * 97);
  let value = 100;
  return Array.from({ length: 10 }, (_, index) => {
    value *= 1 + (trend.momentum / 100) * (index / 9) * 0.28 + (random() - 0.5) * 0.05;
    return value;
  });
}

function wsBreakevenChart() {
  const value = wsValue();
  const months = 24;
  const width = 460;
  const height = 250;
  const left = 44;
  const right = 16;
  const top = 18;
  const bottom = 34;
  let spent = 0;
  let earned = 0;
  const cost = [];
  const benefit = [];
  for (let month = 1; month <= months; month += 1) {
    spent += month <= 12 ? (value.budget * 0.45) / 12 : (value.budget * 0.55) / 12;
    if (month > 3) earned += month <= 12 ? (value.marginRecovered * 0.3) / 12 : value.marginRecovered / 12;
    cost.push(spent);
    benefit.push(earned);
  }
  const max = Math.max(...cost, ...benefit, 1) * 1.1;
  const x = (month) => scale(month, 1, months, left, width - right);
  const y = (amount) => scale(amount, 0, max, height - bottom, top);
  const costPoints = cost.map((amount, index) => [x(index + 1), y(amount)]);
  const benefitPoints = benefit.map((amount, index) => [x(index + 1), y(amount)]);
  const cross = value.breakeven && value.breakeven <= months ? value.breakeven : null;
  return `<div class="viz-card tinted"><h4>Cumulative spend against benefit</h4><p>Benefit starts in month four; the lines cross ${cross ? `in month ${cross}` : "beyond month 24"}.</p>
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Cumulative cost and benefit by month">
      ${[0, 0.5, 1].map((step) => `<line x1="${left}" y1="${y(max * step)}" x2="${width - right}" y2="${y(max * step)}" stroke="${PWC.rule}"/><text x="${left - 7}" y="${y(max * step) + 3.5}" text-anchor="end" font-size="9.5" fill="${PWC.quiet}">₹${(max * step).toFixed(0)}</text>`).join("")}
      <path d="${linePath(benefitPoints)} L${x(months)} ${y(0)} L${x(1)} ${y(0)} Z" fill="${PWC.purple}" opacity="0.1"/>
      <path d="${linePath(costPoints)}" fill="none" stroke="${PWC.grey}" stroke-width="2.2"/>
      <path d="${linePath(benefitPoints)}" fill="none" stroke="${PWC.purple}" stroke-width="2.4"/>
      ${cross ? `<line x1="${x(cross)}" y1="${top}" x2="${x(cross)}" y2="${height - bottom}" stroke="${PWC.ink}" stroke-dasharray="4 4"/><circle cx="${x(cross)}" cy="${y(benefit[cross - 1])}" r="4.5" fill="${PWC.ink}"/><text x="${x(cross) + 7}" y="${top + 12}" font-size="10" font-weight="600" fill="${PWC.ink}">breakeven M${cross}</text>` : ""}
      <text x="${left}" y="${height - 10}" font-size="9.5" fill="${PWC.quiet}">M1</text>
      <text x="${width - right}" y="${height - 10}" text-anchor="end" font-size="9.5" fill="${PWC.quiet}">M24</text>
    </svg>
    <div class="viz-legend"><span><i style="background:${PWC.purple}"></i>Cumulative gross margin</span><span><i style="background:${PWC.grey}"></i>Cumulative spend</span></div>
  </div>`;
}

/* Four capture points, one record. */
function wsProvenanceRibbon() {
  const concept = dxConcept();
  const level = wsEffectiveAutonomy();
  const steps = [
    { name: "Signals", detail: "Sources and retrieval times", got: WS_SIGNALS.filter((sig) => WS.signals[sig.id]).length, of: WS_SIGNALS.length },
    { name: "Draft", detail: "Model, version, prompt", got: level >= 1 ? 1 : 0, of: 1 },
    { name: "Human edit", detail: "Every change, with a reason", got: DX_ELEMENTS.filter((el) => dxElementState(concept.id, el.id) !== "open").length, of: DX_ELEMENTS.length },
    { name: "Approval", detail: "Named person, timestamped", got: DX.approved[concept.id] ? 1 : 0, of: 1 }
  ];
  const width = 720;
  const height = 96;
  const slot = width / steps.length;
  return `<div class="viz-card"><h4>The record assembles itself</h4><p>Nothing here is filled in afterwards.</p>
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Provenance capture points">
      <line x1="30" y1="34" x2="${width - 30}" y2="34" stroke="${PWC.rule}" stroke-width="3"/>
      ${steps.map((step, index) => {
        const cx = slot * index + slot / 2;
        const color = [PWC.deep, PWC.purple, PWC.tangerine, PWC.yellow][index];
        const share = step.got / step.of;
        const circumference = 2 * Math.PI * 13;
        return `<g><circle cx="${cx}" cy="34" r="13" fill="${share ? color : "#FFFFFF"}" stroke="${color}" stroke-width="1.5"/>
        ${share > 0 && share < 1 ? `<circle cx="${cx}" cy="34" r="13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="${(circumference * (1 - share)).toFixed(1)} ${circumference.toFixed(1)}" stroke-dashoffset="${(-circumference * share).toFixed(1)}" transform="rotate(-90 ${cx} 34)"/>` : ""}
        <text x="${cx}" y="38.5" text-anchor="middle" font-size="11" font-weight="700" fill="${share ? "#fff" : color}">${index + 1}</text>
        <text x="${cx}" y="66" text-anchor="middle" font-size="11.5" font-weight="600" fill="${PWC.ink}">${escapeHTML(step.name)}</text>
        <text x="${cx}" y="82" text-anchor="middle" font-size="10" fill="${PWC.quiet}">${escapeHTML(step.detail)} · ${step.got} of ${step.of}</text></g>`;
      }).join("")}
    </svg>
    <div class="viz-legend"><span><i style="background:${PWC.deep}"></i>Captured by the platform</span><span><i style="background:${PWC.tangerine}"></i>Captured from the designer</span><span><i style="background:${PWC.yellow}"></i>Signed by a named human</span></div>
    <div class="viz-caption"><strong>How to read it.</strong> Each point writes to the same concept record, so authorship evidence exists before anyone asks for it. A filled marker means that capture point has fired for the concept currently open; a partial ring means it has fired for some of what it covers and not all.</div>
  </div>`;
}

function rng(seed) {
  return function random() {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function fmtINR(number) {
  const value = Number(number) || 0;
  const absolute = Math.abs(value);
  const sign = value < 0 ? "-" : "";
  if (absolute >= 1e7) return `${sign}₹${(absolute / 1e7).toFixed(2)} Cr`;
  if (absolute >= 1e5) return `${sign}₹${(absolute / 1e5).toFixed(1)} L`;
  return `${sign}₹${Math.round(absolute).toLocaleString("en-IN")}`;
}

function fmtUnits(number) {
  return Math.round(Number(number) || 0).toLocaleString("en-IN");
}

function fmtPercent(number) {
  return `${Math.round(Number(number) || 0)}%`;
}

function fmtLever(key) {
  const lever = LEVERS.find((item) => item.key === key);
  return lever ? lever.format(L[key]) : String(L[key]);
}

function zOf(percent) {
  const table = { 90: 1.2816, 91: 1.3408, 92: 1.4051, 93: 1.4758, 94: 1.5548, 95: 1.6449, 96: 1.7507, 97: 1.8808, 98: 2.0537, 99: 2.3263 };
  const low = Math.floor(percent);
  const high = Math.ceil(percent);
  if (low === high) return table[low];
  return table[low] + (table[high] - table[low]) * (percent - low);
}

function elasticity(discount, eps) {
  return Math.pow(1 - discount / 100, eps);
}

function stateLabel(state) {
  return STATES[state]?.label || state;
}

function actionKey(action) {
  if (!action) return "";
  return `${action.t}|${action.c?.sku?.id}|${action.c?.store?.id}`;
}

function formatTime(date = new Date()) {
  return new Intl.DateTimeFormat("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" }).format(date);
}

function snapshotAction(action) {
  if (!action) return null;
  return {
    ...action,

      ...action.c,

    from: action.from ? { ...action.from, sku: { ...action.from.sku, cat: { ...action.from.sku.cat } }, store: { ...action.from.store } } : null
  };
}

async function buildData() {
  const response = await fetch(`${API_BASE}/api/dashboard-data?t=${Date.now()}`, { cache: "no-store" });
  if (!response.ok) throw new Error(`Data request returned ${response.status}`);
  const data = await response.json();
  if (!data || !Array.isArray(data.stores) || !Array.isArray(data.skus) || !Array.isArray(data.cells)) {
    throw new Error("The control tower response is missing required data");
  }

  STORES = data.stores.map((store) => ({ id: store.id, name: store.name, cluster: store.cluster, mult: store.mult }));
  SUPPLIERS = (data.suppliers || []).map((supplier, index, all) => ({ id: supplier.id, name: supplier.name, share: 1 / all.length, rel: supplier.rel }));
  const supplierById = Object.fromEntries(SUPPLIERS.map((supplier) => [supplier.id, supplier]));
  SKUS = data.skus.map((item) => ({
    id: item.id,
    name: item.name,
    cat: { id: item.cat.id, name: item.cat.name, eps: item.cat.eps, season: item.cat.season, cv: item.cat.cv },
    price: item.price,
    cogs: item.cogs,
    sup: supplierById[item.sup] || SUPPLIERS[0],
    trend: 0.3,
    vel: 1
  }));
  CATS = [...new Map(SKUS.map((sku) => [sku.cat.id, sku.cat])).values()];
  const skuById = Object.fromEntries(SKUS.map((sku) => [sku.id, sku]));
  const storeById = Object.fromEntries(STORES.map((store) => [store.id, store]));
  CELLS = data.cells.flatMap((cell) => {
    const sku = skuById[cell.sku_id];
    const store = storeById[cell.store_id];
    if (!sku || !store) return [];
    return [{
      sku,
      store,
      base: Math.max(0.05, cell.base),
      onHand: cell.onHand,
      inTransit: cell.inTransit,
      recv: cell.recv,
      sold: cell.sold,
      md: cell.md,
      accepted: null,
      realState: cell.realState
    }];
  });
}

function run() {
  const leadWeeks = L.lead / 7;
  const z = zOf(L.svc);
  const planSellThrough = (16 - L.weeks) / 16;
  const network = {};

  CELLS.forEach((cell) => {
    const discount = Math.max(L.disc, cell.md);
    cell.fc = cell.base * (1 + L.shock / 100) * elasticity(discount, cell.sku.cat.eps) * cell.sku.cat.season;
    cell.fc = Math.max(0.05, cell.fc);
    cell.sigma = cell.fc * cell.sku.cat.cv;
    cell.ss = z * cell.sigma * Math.sqrt(leadWeeks + 1);
    cell.cover = cell.onHand / cell.fc;
    cell.st = cell.recv > 0 ? cell.sold / cell.recv : 0;
    cell.growth = cell.sku.trend * 60 + L.shock * 0.5;
    cell.gap = cell.fc * (leadWeeks + 1) + cell.ss - cell.onHand - cell.inTransit;
    cell.price = cell.sku.price * (1 - discount / 100);
    cell.unit = cell.price - cell.sku.cogs;
    const bucket = network[cell.sku.id] || (network[cell.sku.id] = { excess: 0, onHand: 0, forecast: 0 });
    bucket.excess += Math.max(0, cell.onHand - cell.fc * 4);
    bucket.onHand += cell.onHand;
    bucket.forecast += cell.fc;
  });

  const needs = CELLS.filter((cell) => cell.gap > 0.5).sort((a, b) => (b.gap * b.unit) - (a.gap * a.unit));
  let capacityLeft = L.cap;
  CELLS.forEach((cell) => { cell.blocked = false; cell.served = 0; });
  needs.forEach((cell) => {
    const quantity = Math.ceil(cell.gap);
    if (capacityLeft >= quantity) {
      capacityLeft -= quantity;
      cell.served = quantity;
    } else {
      cell.served = Math.max(0, capacityLeft);
      capacityLeft = 0;
      cell.blocked = true;
    }
  });

  // Seeded states describe today. Once a lever moves, the position has to be
  // re-derived, otherwise the state board and the state mix sit still.
  const atBaseline = Object.keys(BASE_L).every((key) => L[key] === BASE_L[key]);
  const distribution = Object.fromEntries(ORDER.map((state) => [state, 0]));
  CELLS.forEach((cell) => {
    const bucket = network[cell.sku.id];
    let state;
    if (cell.realState && atBaseline) {
      state = cell.realState;
      if (state === "SLOW" && cell.blocked) state = "BLOCKED";
    } else if (cell.onHand <= 0) state = "OUT";
    else if (cell.blocked) state = "BLOCKED";
    else if (cell.sku.trend > 0.55 && cell.growth > 35 && cell.cover < 3.5) state = "BREAKOUT";
    else if (cell.cover < leadWeeks + 1) state = cell.gap > 0 && bucket.excess > cell.gap * 1.2 ? "IMBAL" : "RISK";
    else if (L.weeks < 6 && cell.cover > L.weeks) state = "TERMINAL";
    else if (cell.cover > 10) state = "SLOW";
    else state = "HEALTHY";
    cell.state = state;
    distribution[state] += 1;
  });

  let revenueRisk = 0;
  let marginRisk = 0;
  let workingCapital = 0;
  let markdownExposure = 0;
  CELLS.forEach((cell) => {
    workingCapital += (cell.fc * (leadWeeks + 1) + cell.ss) * cell.sku.cogs;
    if (["OUT", "RISK", "BLOCKED", "IMBAL"].includes(cell.state)) {
      cell.unmet = Math.max(0, cell.fc * (leadWeeks + 1) - cell.onHand - cell.inTransit);
      revenueRisk += cell.unmet * cell.price;
      marginRisk += cell.unmet * cell.unit;
    } else {
      cell.unmet = 0;
    }
    if (["TERMINAL", "SLOW"].includes(cell.state)) {
      cell.over = Math.max(0, cell.onHand - cell.fc * L.weeks);
      markdownExposure += cell.over * cell.sku.cogs * 0.55;
    } else {
      cell.over = 0;
    }
  });

  M = {
    dist: distribution,
    revRisk: revenueRisk,
    margRisk: marginRisk,
    wc: workingCapital,
    mdExp: markdownExposure,
    z,
    ltW: leadWeeks,
    planST: planSellThrough,
    capLeft: capacityLeft,
    capNeed: L.cap - capacityLeft
  };
  buildQueue();
}

function buildQueue() {
  const queue = [];
  CELLS.forEach((cell) => {
    if (cell.accepted) return;
    const state = cell.state;
    if (state === "RISK" || state === "OUT") {
      const quantity = Math.ceil(cell.gap);
      if (quantity > 0) queue.push({ t: "Replenish", s: state, c: cell, qty: quantity, val: cell.unmet * cell.unit, why: `Cover ${cell.cover.toFixed(1)} wks against a ${(M.ltW + 1).toFixed(1)} wk horizon. Safety stock ${fmtUnits(cell.ss)} u at ${L.svc}%.` });
    } else if (state === "BREAKOUT") {
      const quantity = Math.ceil(cell.fc * 4);
      queue.push({ t: "Recut", s: state, c: cell, qty: quantity, val: quantity * cell.unit * 0.55 * cell.sku.sup.rel, why: `Trend up ${Math.round(cell.growth)}% with ${cell.cover.toFixed(1)} wks cover. ${cell.sku.sup.name} at ${Math.round(cell.sku.sup.rel * 100)}% on time.` });
    } else if (state === "IMBAL") {
      let donor = null;
      let bestExcess = 0;
      CELLS.forEach((other) => {
        if (other.sku.id !== cell.sku.id || other === cell) return;
        const excess = other.onHand - other.fc * 4;
        if (excess > bestExcess) { bestExcess = excess; donor = other; }
      });
      if (donor && bestExcess > 1) {
        const quantity = Math.min(Math.ceil(bestExcess), Math.ceil(cell.gap > 0 ? cell.gap : cell.fc * 2));
        const benefit = quantity * cell.unit * 0.65 * Math.min(1, L.weeks / 6);
        const cost = quantity * L.tcost + 1500;
        if (benefit - cost > 0) queue.push({ t: "Transfer", s: state, c: cell, from: donor, qty: quantity, val: benefit - cost, why: `${donor.store.name} holds ${fmtUnits(bestExcess)} u of excess. Benefit ${fmtINR(benefit)} against ${fmtINR(cost)} to move it.` });
      }
    } else if (state === "SLOW" || state === "TERMINAL") {
      const ladderResult = ladder(cell);
      if (ladderResult.best > Math.max(L.disc, cell.md)) queue.push({ t: "Markdown", s: state, c: cell, depth: ladderResult.best, val: ladderResult.gain, ladder: ladderResult, why: `Sell through ${Math.round(cell.st * 100)}% against ${Math.round(M.planST * 100)}% plan, ${cell.cover.toFixed(0)} wks cover with ${L.weeks} wks left.` });
    } else if (state === "BLOCKED") {
      queue.push({ t: "Escalate", s: state, c: cell, qty: Math.ceil(cell.gap), val: -cell.unmet * cell.unit, why: `Need ${fmtUnits(cell.gap)} u but weekly capacity is fully committed. Substitute or accept the loss.` });
    }
  });
  queue.sort((a, b) => Math.abs(b.val) - Math.abs(a.val));
  QUEUE_TOTAL = queue.length;
  QUEUE = queue.slice(0, 400);
  if (!SELECTED_ID && QUEUE[0]) SELECTED_ID = actionKey(QUEUE[0]);
  if (SELECTED_ID && !QUEUE.some((item) => actionKey(item) === SELECTED_ID) && !SELECTED_SNAPSHOT) SELECTED_ID = QUEUE[0] ? actionKey(QUEUE[0]) : null;
}

function ladder(cell) {
  const steps = [0, 10, 20, 30, 40, 50];
  const points = [];
  let bestMargin = -Infinity;
  let bestDiscount = 0;
  const currentDiscount = Math.max(L.disc, cell.md);
  let currentMargin = 0;
  steps.forEach((discount) => {
    const quantity = Math.min(cell.onHand, cell.base * (1 + L.shock / 100) * elasticity(discount, cell.sku.cat.eps) * cell.sku.cat.season * L.weeks);
    const price = cell.sku.price * (1 - discount / 100);
    const leftover = Math.max(0, cell.onHand - quantity);
    const margin = quantity * (price - cell.sku.cogs) - leftover * cell.sku.cogs * 0.55;
    points.push({ discount, margin, quantity });
    if (margin > bestMargin) { bestMargin = margin; bestDiscount = discount; }
    if (discount === Math.round(currentDiscount / 10) * 10) currentMargin = margin;
  });
  return { points, best: bestDiscount, gain: Math.max(0, bestMargin - currentMargin) };
}

function _recordDecision(action, cell, decisionType) {
  if (DEMO_MODE) return;
  const payload = {
    product_id: cell.sku.id,
    location_id: cell.store.id,
    recommendation_type: action.t,
    decision_type: decisionType,
    recommended_quantity: action.qty ? Math.round(action.qty) : null,
    recommended_price: action.t === "Markdown" && action.depth != null ? Math.round(cell.sku.price * (1 - action.depth / 100) * 100) / 100 : null,
    expected_margin: action.val != null ? Math.round(action.val * 100) / 100 : null,
    reason: action.why || null,
    planner_id: "demo_planner"
  };
  fetch(`${API_BASE}/api/dashboard-decision`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
    .then((response) => response.json())
    .catch(() => {
      decisionNotice = "The decision was not recorded by the service. The local view remains open for retry.";
      render();
    });
}

function applyAccept(action) {
  const cell = action.c;
  if (action.t === "Replenish" || action.t === "Recut") { cell.inTransit += action.qty; cell.recv += action.qty; }
  else if (action.t === "Transfer") { action.from.onHand -= action.qty; cell.onHand += action.qty; }
  else if (action.t === "Markdown") cell.md = action.depth;
  cell.accepted = action.t;
  RECOVERED += Math.max(0, action.val);
  LOG.unshift({ t: action.t, sku: cell.sku.id, store: cell.store.id, val: action.val, decision: "Accepted", time: formatTime() });
  _recordDecision(action, cell, "Accept");
}

function applyReject(action) {
  action.c.accepted = "Rejected";
  LOG.unshift({ t: action.t, sku: action.c.sku.id, store: action.c.store.id, val: 0, decision: "Rejected", time: formatTime() });
  _recordDecision(action, action.c, "Reject");
}

function linePath(points) {
  return points.map((point, index) => `${index ? "L" : "M"}${point[0].toFixed(1)} ${point[1].toFixed(1)}`).join(" ");
}

function scale(value, low, high, start, end) {
  return start + (end - start) * ((value - low) / (high - low || 1));
}

}

function ladderChart(cell) {
  const result = ladder(cell);
  const width = 560;
  const height = 262;
  const left = 74;
  const right = 22;
  const top = 26;
  const bottom = 58;

  const min = Math.min(...margins, 0) * 0.9;
  const x = (discount) => scale(discount, 0, 50, left, width - right);
  const y = (value) => scale(value, min, max, height - bottom, top);
  const points = result.points.map((point) => [x(point.discount), y(point.margin)]);
  const bestPoint = result.points.find((point) => point.discount === result.best) || result.points[0];
  const grid = [0, 1, 2, 3].map((step) => {
    const value = min + ((max - min) * step) / 3;
    return `<line x1="${left}" y1="${y(value)}" x2="${width - right}" y2="${y(value)}" stroke="#E4DED5"/><text x="${left - 10}" y="${y(value) + 4}" text-anchor="end" font-size="11" fill="#4F4A44">${fmtINR(value)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Modelled margin at each markdown depth, with the recommended depth marked">
    ${grid}
    <line x1="${x(40)}" y1="${top}" x2="${x(40)}" y2="${height - bottom}" stroke="#7A0F0A" stroke-dasharray="4 4"/>
    <text x="${x(40) + 5}" y="${top + 2}" font-size="10.5" font-weight="700" fill="#7A0F0A">40% guardrail</text>
    <path d="${linePath(points)}" fill="none" stroke="#C9A227" stroke-width="2.6" stroke-linejoin="round"/>
    ${result.points.map((point) => `<circle cx="${x(point.discount)}" cy="${y(point.margin)}" r="${point.discount === result.best ? 6 : 3.5}" fill="${point.discount === result.best ? "#C6007E" : "#2D2A26"}"/><text x="${x(point.discount)}" y="${height - 34}" text-anchor="middle" font-size="11" font-weight="${point.discount === result.best ? 700 : 400}" fill="${point.discount === result.best ? "#C6007E" : "#4F4A44"}">${point.discount}%</text>`).join("")}
    <text x="${x(result.best)}" y="${y(bestPoint.margin) - 14}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C6007E">${fmtINR(bestPoint.margin)} at ${result.best}%</text>
    <text transform="translate(20 ${(top + height - bottom) / 2}) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A1A">Modelled margin, ₹</text>
    <text x="${(left + width - right) / 2}" y="${height - 10}" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A1A">Markdown depth, % off ticket price</text>
  </svg>`;
}

function renderImpactStrip() {
  if (!M || !M.dist || loadState !== "ready") return "";
  if (WS_PAGES.includes(PAGE) && PAGE !== "overview") return "";
  const accepted = LOG.filter((item) => item.decision === "Accepted").length;
  const rejected = LOG.length - accepted;
  const base = M_BASE || { margRisk: M.margRisk, revRisk: M.revRisk, wc: M.wc, mdExp: M.mdExp, recovered: 0 };
  const move = (current, start, lowerIsBetter = true) => {
    const delta = current - start;
    if (Math.abs(delta) < Math.max(1, Math.abs(start) * 0.002)) return `<span class="istrip-move flat">no change from baseline</span>`;
    const better = lowerIsBetter ? delta < 0 : delta > 0;
    return `<span class="istrip-move ${better ? "better" : "worse"}">${delta < 0 ? "▼" : "▲"} ${fmtINR(Math.abs(delta))} ${better ? "better" : "worse"}</span>`;
  };
  const metrics = [
    { label: "Margin at risk", value: fmtINR(M.margRisk), move: move(M.margRisk, base.margRisk), meta: `${(M.dist.OUT || 0) + (M.dist.RISK || 0) + (M.dist.BLOCKED || 0) + (M.dist.IMBAL || 0)} positions exposed`, tone: "risk" },
    { label: "Revenue at risk", value: fmtINR(M.revRisk), move: move(M.revRisk, base.revRisk), meta: "Unmet demand this horizon", tone: "risk" },
    { label: "Target inventory", value: fmtINR(M.wc), move: move(M.wc, base.wc), meta: `${(M.ltW + 1).toFixed(1)} week cover horizon`, tone: "neutral" },
    { label: "Markdown exposure", value: fmtINR(M.mdExp), move: move(M.mdExp, base.mdExp), meta: `${(M.dist.SLOW || 0) + (M.dist.TERMINAL || 0)} over covered positions`, tone: "warn" },
    { label: "Recovered", value: fmtINR(RECOVERED), move: move(RECOVERED, base.recovered, false), meta: `${accepted} accepted · ${rejected} rejected`, tone: "recovered" }
  ];
  return `<section class="istrip" aria-label="Live model impact">
    ${metrics.map((metric) => `<div class="istrip-cell tone-${metric.tone}"><span class="istrip-label">${metric.label}</span><strong class="istrip-value">${metric.value}</strong>${metric.move}<span class="istrip-meta">${metric.meta}</span></div>`).join("")}
  </section>`;
}
