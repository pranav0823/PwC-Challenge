  const rows = actions.map((action, index) => {
    const selected = actionKey(action) === SELECTED_ID;
    const key = escapeHTML(actionKey(action));
    const proposed = action.t === "Markdown" ? `Take to ${action.depth}% off` : `${fmtUnits(action.qty)} units`;
    const decided = action.c.accepted;
    return `<article class="dq-row ${selected ? "is-selected" : ""} ${decided ? "is-decided" : ""}" data-action-id="${key}" tabindex="0" aria-selected="${selected}">
      <div class="dq-rank">${String(index + 1).padStart(2, "0")}</div>
      <div class="dq-tag"><span class="tag tag-${(action.t || "").toLowerCase().replace(/[^a-z]/g, "")}">${escapeHTML(action.t)}</span><span class="dq-state state-pill state-${action.s}">${escapeHTML(stateLabel(action.s))}</span></div>
      <div class="dq-item"><strong>${escapeHTML(action.c.sku.name || action.c.sku.id)}</strong><span class="dq-meta"><span class="mono">${escapeHTML(action.c.sku.id)}</span> · ${escapeHTML(action.c.store.name)}</span></div>
      <div class="dq-reason">${escapeHTML(action.why)}</div>
      <div class="dq-value"><strong>${action.val > 0 ? fmtINR(action.val) : "none"}</strong><span>value at stake</span></div>
      <div class="dq-qty"><strong>${escapeHTML(proposed)}</strong><span>proposed</span></div>
      <div class="dq-actions">${decided
        ? `<span class="dq-done ${decided === "Rejected" ? "is-reject" : "is-accept"}">${decided === "Rejected" ? "Rejected" : "Accepted"}</span>`
        : `<button type="button" class="btn-accept" data-queue-accept="${key}">Accept</button><button type="button" class="btn-reject" data-queue-reject="${key}">Reject</button>`}</div>
    </article>`;
  }).join("");
  const pager = paged ? `<div class="dq-pager">
      <span class="dq-pager-count">Showing <strong>${shown}</strong> of <strong>${all.length}</strong> open recommendations${FILTER ? " in this filter" : ""}</span>
      <span class="dq-pager-actions">
        ${shown < all.length ? `<button type="button" class="pager-btn primary" data-docket-more>Show next ${Math.min(20, all.length - shown)}</button>` : ""}
        ${shown < all.length ? `<button type="button" class="pager-btn" data-docket-all>Show all ${all.length}</button>` : ""}
        ${shown > 20 ? `<button type="button" class="pager-btn" data-docket-reset>Back to top 20</button>` : ""}
      </span>
    </div>` : "";
  return `<div class="dq-list">
    <div class="dq-head"><span>#</span><span>Action</span><span>Item and location</span><span>Why this action</span><span>Value</span><span>Proposed</span><span>Decision</span></div>
    ${rows}
  </div>${pager}${FILTER ? `<div class="filter-chip">${escapeHTML(filterLabel())}<button type="button" data-clear-filter aria-label="Clear filter">×</button></div>` : ""}`;
}

function filteredQueue() {
  if (!FILTER) return QUEUE;
  return QUEUE.filter((action) => action.c.store.id === FILTER.storeId && action.c.sku.cat.id === FILTER.categoryId);
}

function filterLabel() {
  const store = STORES.find((item) => item.id === FILTER?.storeId);
  const category = CATS.find((item) => item.id === FILTER?.categoryId);
  return `${store?.name || FILTER?.storeId} / ${category?.name || FILTER?.categoryId}`;
}

function renderConstraints() {
  const rows = [
    { state: "OUT", title: "Stocked out", reason: `${M.dist.OUT || 0} positions at zero on-hand; immediate exposure.`, label: "Critical" },
    { state: "BLOCKED", title: "Supply blocked", reason: `${M.dist.BLOCKED || 0} positions exceed committed weekly cut capacity.`, label: "Constraint" },
    { state: "RISK", title: "Stockout risk", reason: `${M.dist.RISK || 0} positions below the ${(M.ltW + 1).toFixed(1)} week horizon.`, label: "Review" },
    { state: "SLOW", title: "Slow mover", reason: `${M.dist.SLOW || 0} positions hold more than 10 weeks of cover.`, label: "Margin" }
  ];
  return `<section class="aside-section"><h3>Open constraints</h3><p>Operational truths requiring attention, not generic alerts.</p><div class="constraint-list">${rows.map((row) => `<div class="constraint"><i class="severity-dot ${STATES[row.state].severity}" style="background:${stateColor(row.state)}"></i><div><div class="constraint-title">${row.title}</div><div class="constraint-reason">${row.reason}</div></div><span class="constraint-state">${row.label}</span></div>`).join("")}</div></section>`;
}

function evidenceFor(action) {
  if (!action) return [];
  const cell = action.c;
  const cover = `${cell.cover.toFixed(1)} wks`;
  const horizon = `${(M.ltW + 1).toFixed(1)} wk horizon`;
  if (action.t === "Transfer") return [
    ["Situation", `Stock is in the wrong place. ${escapeHTML(action.from?.store.name || "Donor store")} holds ${fmtUnits(Math.max(0, action.from?.onHand - action.from?.fc * 4 || 0))} u of excess.`],
    ["Network signal", `${escapeHTML(cell.store.name)} is at <strong>${cover}</strong> against ${horizon}.`],
    ["Transfer lane", `${escapeHTML(action.from?.store.name || "Source")} → ${escapeHTML(cell.store.name)} · <strong>₹${L.tcost}/u</strong>.`],
    ["Proposed effect", `Protect <strong>${fmtINR(action.val)}</strong> margin.`],
    ["Caveat", "Move clears the transfer hurdle only at current cost."]
  ];
  if (action.t === "Markdown") return [
    ["Situation", `Cover is <strong>${cover}</strong> with ${L.weeks} weeks left in season.`],
    ["Sell through", `Current sell through is <strong>${Math.round(cell.st * 100)}%</strong> vs ${Math.round(M.planST * 100)}% plan.`],
    ["Margin ladder", `The modeled peak is <strong>${action.depth}%</strong> off.`],
    ["Proposed effect", `Recover <strong>${fmtINR(action.val)}</strong> before season end.`],
    ["Caveat", "Deeper markdown is not required at current demand."]
  ];
  if (action.t === "Recut") return [
    ["Situation", `Trend is up <strong>${Math.round(cell.growth)}%</strong> with ${cover} cover.`],
    ["Demand signal", "Velocity remains above plan for the current review window."],
    ["Supply context", `${escapeHTML(cell.sku.sup.name)} · <strong>${Math.round(cell.sku.sup.rel * 100)}%</strong> reliability.`],
    ["Proposed effect", `Capture <strong>${fmtINR(action.val)}</strong> incremental margin.`],
    ["Caveat", "A longer lead time compresses the opportunity window."]
  ];
  if (action.t === "Escalate") return [
    ["Situation", `Need is <strong>${fmtUnits(action.qty)} u</strong> against current cover.`],
    ["Capacity signal", "Weekly cut capacity is fully committed."],
    ["Supply context", "Supplier allocation is below the open gap."],
    ["Proposed effect", `Surface <strong>${fmtINR(Math.abs(action.val))}</strong> margin at risk.`],
    ["Caveat", "Substitute or absorb the remaining exposure."]
  ];
  return [
    ["Situation", `Cover is <strong>${cover}</strong> against a ${horizon}.`],
    ["Demand signal", `Demand is up <strong>${Math.round(cell.growth)}%</strong> under this scenario.`],
    ["Supply context", `${escapeHTML(cell.sku.sup.name)} · <strong>${Math.round(cell.sku.sup.rel * 100)}%</strong> reliability.`],
    ["Proposed effect", `Protect <strong>${fmtINR(action.val)}</strong> margin.`],
    ["Caveat", `Weekly capacity may constrain the ${action.t === "Replenish" ? "cut" : "action"}.`]
  ];
}

function renderInspector() {
  const action = getSelectedAction();
  if (!action) return `<section class="inspector"><div class="empty-state"><strong>No action selected</strong>Choose a recommendation row to inspect its rationale and proposed effect.</div></section>`;
  const status = DECISION_STATUS;
  const proposed = action.t === "Markdown" ? `Take to ${action.depth}%` : `${fmtUnits(action.qty)} u`;
  const statusMarkup = status ? `<div class="inspector-status ${status === "Rejected" ? "rejected" : ""}"><i class="ti ti-${status === "Accepted" ? "circle-check" : "circle-x"}" aria-hidden="true"></i>${status} record updated</div>` : "";
  const actionTitle = `${action.t} ${action.c.sku.id}`;
  const actionButton = status === "Accepted" ? "Accepted record updated" : status === "Rejected" ? "Rejected record updated" : "Accept recommendation";
  return `<section class="inspector" aria-labelledby="inspectorTitle"><div class="inspector-top"><div><div class="inspector-kicker">Decision review · selected</div><h3 id="inspectorTitle">${escapeHTML(actionTitle)}</h3><div class="inspector-store">${escapeHTML(action.c.store.name)}</div></div><div class="inspector-index">${stateLabel(action.s).toUpperCase()}</div></div><div class="inspector-impact"><div><span class="impact-label">Expected value</span><span class="impact-value">${action.val > 0 ? fmtINR(action.val) : "none"}</span></div><div><span class="impact-label">Proposed</span><span class="impact-value">${escapeHTML(proposed)}</span></div></div>${statusMarkup}<div class="rationale-title">Recommendation rationale</div><p class="rationale-sub">Evidence register for the selected action.</p><div class="evidence-register">${evidenceFor(action).map(([label, value], index) => `<div class="evidence-row"><span class="evidence-label">${label}</span><span class="evidence-value ${index === 1 ? "purple" : ""}">${value}</span></div>`).join("")}</div><div class="inspector-actions"><button class="primary-btn ${status === "Accepted" ? "accepted" : status === "Rejected" ? "rejected" : ""}" type="button" data-accept ${status ? "disabled" : ""}>${actionButton}</button><button class="secondary-btn" type="button" data-reject>${status ? "Close" : "Reject"}</button></div>${REJECT_CONFIRM ? `<div class="reject-confirm">Reject this ${action.t.toLowerCase()} recommendation? The position will remain exposed in the queue.<div class="confirm-actions"><button type="button" data-confirm-reject>Confirm reject</button><button type="button" class="cancel" data-cancel-reject>Cancel</button></div></div>` : ""}</section>`;
}

function renderDemandEvidence() {
  return `<section class="evidence-sheet"><div class="evidence-title"><h3>Demand forecast evidence</h3><span>Actual / forecast · units per week</span></div><div class="chart-frame">${demandChart()}<div class="chart-note"><span><i class="chart-key"></i>Actual</span><span><i class="chart-key forecast"></i>Forecast</span><span><i class="chart-key selected"></i>Selected action signal</span></div></div><div class="readout"><strong>Demand is building into the selected position.</strong> The current action protects cover before the forecast moves beyond the supplier lead time horizon.</div></section>`;
}

function renderSelectedPosition() {
  const action = getSelectedAction();
  const cell = action?.c || CELLS.slice().sort((a, b) => a.cover - b.cover)[0];
  if (!cell) return `<section class="evidence-sheet"><div class="empty-state"><strong>No position data</strong>Load the control-tower data to inspect inventory evidence.</div></section>`;
  return `<section class="evidence-sheet"><div class="evidence-title"><h3>Selected position</h3><span class="mono">${escapeHTML(cell.sku.id)}</span></div><div class="position-ledger"><div class="position-row"><span>Inventory cover</span><strong>${cell.cover.toFixed(1)} wks on hand · ${fmtUnits(cell.inTransit)} u in transit</strong></div><div class="position-row"><span>Safety stock</span><strong>${fmtUnits(cell.ss)} u at ${L.svc}% service target</strong></div><div class="position-row"><span>Unit economics</span><strong>${fmtINR(cell.unit)} margin at ${fmtINR(cell.price)} price</strong></div><div class="position-row"><span>Capacity</span><strong>${fmtUnits(Math.max(0, cell.gap))} u requested of ${fmtUnits(L.cap)} u weekly cut</strong></div></div></section>`;
}

function renderDecisionRecord() {
  const accepted = LOG.filter((entry) => entry.decision === "Accepted").length;
  const body = LOG.length
    ? `<div class="dq-list dq-log">${LOG.slice(0, 12).map((entry) => `<article class="dq-row is-log">
        <div class="dq-tag"><span class="tag tag-${(entry.t || "").toLowerCase().replace(/[^a-z]/g, "")}">${escapeHTML(entry.t)}</span></div>

      </article>`).join("")}</div>`
    : `<div class="empty-state">Accepted and rejected actions will appear here as the audit trail for this session.</div>`;

    <div class="viz-legend review-legend"><span><i class="action-mark red"></i>Critical / immediate</span><span><i class="action-mark amber"></i>Commercial opportunity</span><span><i class="action-mark blue"></i>Network move</span><span><i class="action-mark graphite"></i>Escalation / constraint</span></div>
    ${renderActionDocket(20, true)}
  </section>
  <section class="page-section review-evidence">
    <div class="section-head"><div><h3>2 · Evidence before decision</h3><p>The selected position combines demand, inventory, unit economics, supply context and the proposed action.</p></div></div>
    <div class="left-lower">${renderDemandEvidence()}${renderInspector()}</div>
  </section>
  <section class="page-section review-record-section">
    ${renderDecisionRecord()}
  </section>`;
}

function renderDemandPage() {
  const byCategory = CATS.map((category) => ({ label: category.name, value: CELLS.filter((cell) => cell.sku.cat.id === category.id).reduce((sum, cell) => sum + cell.fc, 0), tone: "blue" })).sort((a, b) => b.value - a.value);
  return `${renderRefreshNotice()}<section class="page-section"><div class="page-section-header"><div><h2 class="page-section-title">Demand is building into the replenishment horizon</h2><p>Actual demand through week 32, followed by the live forecast under ${escapeHTML(PRESET)}.</p></div><span class="mono">${L.svc}% interval</span></div><div class="chart-frame">${demandChart()}<div class="chart-note"><span><i class="chart-key"></i>Actual</span><span><i class="chart-key forecast"></i>Forecast</span></div></div></section><section class="page-grid-2"><div class="rule-panel"><h4>Forecast by category</h4><p>Units per week across the current network.</p>${renderBars(byCategory)}</div><div class="rule-panel"><h4>Forecast drivers</h4><p>Inputs that move the replenishment horizon.</p><div class="kv-list"><div class="kv-row"><span>Demand shock applied</span><strong>${L.shock > 0 ? "+" : ""}${L.shock}%</strong></div><div class="kv-row"><span>Price effect at ${L.disc}% off</span><strong>×${elasticity(L.disc, CATS.reduce((sum, category) => sum + category.eps, 0) / Math.max(1, CATS.length)).toFixed(2)}</strong></div><div class="kv-row"><span>Safety factor z</span><strong>${M.z.toFixed(3)}</strong></div><div class="kv-row"><span>Cover horizon</span><strong>${(M.ltW + 1).toFixed(1)} wks</strong></div></div></div></section>`;
}

function renderStateBoard() {
  const map = {};
  CELLS.forEach((cell) => {
    const key = `${cell.store.id}|${cell.sku.cat.id}`;
    const group = map[key] || (map[key] = { total: 0, offPlan: 0, states: {} });
    group.total += 1;
    if (cell.state !== "HEALTHY") { group.offPlan += 1; group.states[cell.state] = (group.states[cell.state] || 0) + 1; }
  });
  const rows = STORES.map((store) => `<tr><td><span class="store-name">${escapeHTML(store.name)}</span><span class="store cluster">${escapeHTML(store.cluster)} · ${store.id}</span></td>${CATS.map((category) => {
    const group = map[`${store.id}|${category.id}`];
    if (!group) return "<td>none</td>";
    const dominant = Object.keys(group.states).sort((a, b) => group.states[b] - group.states[a])[0] || "HEALTHY";
    const quiet = group.offPlan / group.total < 0.3;
    const selected = FILTER?.storeId === store.id && FILTER?.categoryId === category.id;
    const label = `${store.name}, ${category.name}: ${group.offPlan} of ${group.total} positions need action, mostly ${stateLabel(dominant).toLowerCase()}`;
    return `<td><button type="button" class="state-cell ${STATES[dominant].stateClass} ${quiet ? "quiet" : ""} ${selected ? "selected" : ""}" data-cell="${store.id}|${category.id}" title="${escapeHTML(label)}" aria-label="${escapeHTML(label)}">${group.offPlan} <span class="sr-only">${stateLabel(dominant)}</span></button></td>`;
  }).join("")}</tr>`).join("");
  return `<div class="state-board-wrap"><table class="state-table"><thead><tr><th>Store / cluster</th>${CATS.map((category) => `<th>${escapeHTML(category.name)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div><div class="legend board-legend">${LEGEND_ORDER.map((state) => `<span class="legend-item"><i class="legend-dot" style="background:${stateColor(state)}"></i>${stateLabel(state)}</span>`).join("")}</div>${FILTER ? `<div class="filter-chip">${escapeHTML(filterLabel())}<button type="button" data-clear-filter aria-label="Clear filter">×</button></div>` : ""}`;
}

function renderNetworkPage() {
  const storeRows = STORES.map((store) => {
    const cells = CELLS.filter((cell) => cell.store.id === store.id);
    const cover = cells.reduce((sum, cell) => sum + cell.onHand, 0) / Math.max(1, cells.reduce((sum, cell) => sum + cell.fc, 0));
    return { label: store.name, value: cover, tone: cover < M.ltW + 1 ? "red" : cover > 10 ? "amber" : "green" };
  }).sort((a, b) => a.value - b.value);
  const transferRows = QUEUE.filter((action) => action.t === "Transfer");
  return `${renderRefreshNotice()}<section class="page-section"><div class="page-section-header"><div><h2 class="page-section-title">Where is the network off plan?</h2><p>Select a store/category cell to filter matching actions and inspect its state.</p></div><span class="mono">${fmtUnits(CELLS.length)} live positions</span></div>${renderStateBoard()}</section><section class="page-grid-2"><div class="rule-panel"><h4>Stock cover by store</h4><p>Target band is ${(M.ltW + 1).toFixed(1)} to 10 weeks.</p>${renderBars(storeRows, (value) => `${value.toFixed(1)} w`)}</div><div class="rule-panel"><h4>Transfer economics</h4><p>Stock is in the wrong place when one store is over covered and another is below horizon.</p><div class="kv-list"><div class="kv-row"><span>Transfer cost / unit</span><strong>₹${L.tcost}</strong></div><div class="kv-row"><span>Fixed lane cost</span><strong>₹1,500</strong></div><div class="kv-row"><span>Transfers clearing hurdle</span><strong>${transferRows.length}</strong></div><div class="kv-row"><span>Value if approved</span><strong>${fmtINR(transferRows.reduce((sum, action) => sum + action.val, 0))}</strong></div></div></div></section><section class="page-section"><div class="section-head"><div><h3>Transfer recommendations</h3><p>Existing network actions ranked by value.</p></div><span class="count-note">${transferRows.length} open</span></div>${renderActionTable(transferRows)}</section>`;
}

function renderActionTable(actions) {
  if (!actions.length) return `<div class="empty-state"><strong>No matching transfer actions.</strong>There are no transfer recommendations clearing the current economic hurdle.</div>`;
  const original = QUEUE;
  const saved = QUEUE;
  QUEUE = actions;
  const html = renderActionDocket(actions.length);
  QUEUE = saved;
  return html;
}

function renderMarginPage() {
  const candidates = QUEUE.filter((action) => action.t === "Markdown");
  const cell = candidates[0]?.c || CELLS.slice().sort((a, b) => b.cover - a.cover)[0];
  return `${renderRefreshNotice()}<section class="page-grid-2"><div class="rule-panel"><h4>Markdown ladder</h4><p>${cell ? `${escapeHTML(cell.sku.name)} at ${escapeHTML(cell.store.name)}` : "No candidate selected"}</p>${cell ? `<div class="chart-frame">${ladderChart(cell)}</div>` : ""}<div class="readout"><strong>Recommendation rationale.</strong> Margin is modelled as demand at each discount less the salvage penalty on remaining stock. The highlighted point is the current modeled peak.</div></div><div class="rule-panel"><h4>Season position</h4><p>What changes when weeks remaining move below six.</p><div class="kv-list"><div class="kv-row"><span>Weeks remaining</span><strong>${L.weeks}</strong></div><div class="kv-row"><span>Positions over covered</span><strong>${(M.dist.SLOW || 0) + (M.dist.TERMINAL || 0)}</strong></div><div class="kv-row"><span>Markdown exposure</span><strong>${fmtINR(M.mdExp)}</strong></div><div class="kv-row"><span>Recoverable by markdown</span><strong>${fmtINR(candidates.reduce((sum, action) => sum + action.val, 0))}</strong></div></div></div></section><section class="page-section"><div class="section-head"><div><h3>Markdown candidates</h3><p>Open positions where the modeled ladder exceeds the current discount.</p></div><span class="count-note">${candidates.length} open</span></div>${renderActionDocket(10)}</section>`;
}

function renderSupplyPage() {
  const supplierRows = SUPPLIERS.map((supplier) => {
    const need = CELLS.filter((cell) => cell.sku.sup.id === supplier.id).reduce((sum, cell) => sum + Math.max(0, cell.gap), 0);
    const capacity = L.cap * supplier.share;
    return { label: supplier.name, value: need, tone: need > capacity ? "graphite" : "green", capacity };
  });
  const blocked = QUEUE.filter((action) => action.t === "Escalate");
  return `${renderRefreshNotice()}<section class="page-grid-2"><div class="rule-panel"><h4>Demand on each supplier</h4><p>Units requested this week against each supplier share.</p>${renderBars(supplierRows)}</div><div class="rule-panel"><h4>Capacity book</h4><p>Blocked positions are the honest part of the model.</p><div class="kv-list"><div class="kv-row"><span>Weekly capacity</span><strong>${fmtUnits(L.cap)} u</strong></div><div class="kv-row"><span>Committed</span><strong>${fmtUnits(M.capNeed)} u</strong></div><div class="kv-row"><span>Uncommitted</span><strong>${fmtUnits(M.capLeft)} u</strong></div><div class="kv-row"><span>Lead time</span><strong>${L.lead} days</strong></div><div class="kv-row"><span>Positions blocked</span><strong>${M.dist.BLOCKED || 0}</strong></div></div></div></section><section class="page-section"><div class="section-head"><div><h3>Blocked by capacity</h3><p>Escalations where supply cannot satisfy the open gap.</p></div><span class="count-note">${blocked.length} open</span></div>${renderActionDocket(10)}</section>`;
}

function renderScenarioPage() {
  const deltas = LEVERS.filter((lever) => L[lever.key] !== BASE_L[lever.key]);
  const changedText = deltas.length ? deltas.map((lever) => `${lever.label}: ${lever.format(L[lever.key])}`).join(" · ") : "Baseline assumptions are unchanged.";
  return `${renderRefreshNotice()}<div class="scenario-page-note"><i class="ti ti-adjustments-horizontal" aria-hidden="true"></i><span><strong>Adjust assumptions in the persistent left panel.</strong> The main decision packet stays visible while the model recomputes; no covering scenario drawer is used.</span></div><section class="scenario-outcome"><h3>What changes if we act on this scenario?</h3><p>${escapeHTML(changedText)}</p></section><section class="page-grid-3"><div class="rule-panel"><h4>Value at stake</h4><p>Calculated from the current model pass.</p><div class="kv-list"><div class="kv-row"><span>Margin at risk</span><strong>${fmtINR(M.margRisk)}</strong></div><div class="kv-row"><span>Revenue at risk</span><strong>${fmtINR(M.revRisk)}</strong></div><div class="kv-row"><span>Recovered</span><strong>${fmtINR(RECOVERED)}</strong></div></div></div><div class="rule-panel"><h4>State mix</h4><p>Positions requiring a decision.</p>${renderBars(ORDER.filter((state) => state !== "HEALTHY").map((state) => ({ label: stateLabel(state), value: M.dist[state] || 0, tone: STATES[state].severity === "high" ? "red" : STATES[state].severity === "medium" ? "amber" : "blue" })), (value) => `${value} pos`)}</div><div class="rule-panel"><h4>Capacity outcome</h4><p>Open supply constraints under this scenario.</p><div class="kv-list"><div class="kv-row"><span>Capacity committed</span><strong>${fmtUnits(M.capNeed)} u</strong></div><div class="kv-row"><span>Capacity left</span><strong>${fmtUnits(M.capLeft)} u</strong></div><div class="kv-row"><span>Actions awaiting review</span><strong>${QUEUE.length}</strong></div></div></div></section><section class="page-section"><div class="section-head"><div><h3>Current scenario action queue</h3><p>Use the left panel to compare Baseline, Festive surge, Supplier failure, Warm winter and Cash-tight quarter.</p></div></div>${renderActionDocket(12)}</section>`;
}

function renderLoadingPage() {
  return `<div class="refresh-notice"><span class="notice-copy"><i class="ti ti-loader-2" aria-hidden="true"></i>Loading control-tower data while keeping the decision shell available.</span></div><section class="summary-grid"><section class="conclusion"><div class="skeleton-line"></div><div class="skeleton-line large"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:40%"></div></section><div class="metric-ledger"><div class="metric-cell"><div class="skeleton-line"></div><div class="skeleton-line large"></div></div><div class="metric-cell"><div class="skeleton-line"></div><div class="skeleton-line large"></div></div><div class="metric-cell"><div class="skeleton-line"></div><div class="skeleton-line large"></div></div><div class="provenance">Preserving the executive layout while the model responds.</div></div></section><div class="skeleton-block"></div>`;
}

function renderErrorPage() {
  return `<div class="inline-error"><span class="notice-copy"><i class="ti ti-alert-triangle" aria-hidden="true"></i>Control tower data could not be refreshed. Existing decisions have not been changed.</span><button class="notice-action" type="button" data-refresh>Try again</button></div><section class="scenario-outcome"><h3>Last valid decision surface unavailable</h3><p>The shell remains available. Check the data service and try again; raw endpoint details are kept out of the executive view.</p></section><section class="page-grid-2"><div class="rule-panel"><h4>What stays available</h4><p>Scenario assumptions remain visible in the left panel and will apply when data returns.</p><div class="kv-list"><div class="kv-row"><span>Current scenario</span><strong>${escapeHTML(PRESET)}</strong></div><div class="kv-row"><span>Decision persistence</span><strong>Unchanged</strong></div></div></div><div class="rule-panel"><h4>Recovery</h4><p>Retry the data refresh without leaving this page.</p><button class="primary-btn" type="button" data-refresh>Try again</button></div></section>`;
}

function renderPage() {
  if (WS_PAGES.includes(PAGE)) {
    return { journey: dxJourneyPage, trend: wsTrendPage, copilot: dxCopilotPage, room: dxRoomPage, refine: dxRefinePage, studio: wsStudioPage, cycle: wsCyclePage, brands: wsBrandsPage, trust: wsTrustPage, rollout: wsRolloutPage }[PAGE]();
  }
  if (loadState === "loading") return renderLoadingPage();
  if (loadState === "error") return renderErrorPage();
  if (!CELLS.length) return `<div class="scenario-outcome"><h3>No position data returned</h3><p>The control tower is connected, but there are no positions for this scenario. Compare assumptions in the left panel or retry the refresh.</p></div>`;
  return ({ overview: renderOverview, board: renderBoardPage, review: renderReviewPage, demand: renderDemandPage, network: renderNetworkPage, margin: renderMarginPage, supply: renderSupplyPage, decisions: renderDecisionsPage, scenario: renderScenarioPage }[PAGE] || renderOverview)();
}

function captureScrollState() {
  return {
    x: window.scrollX,
    y: window.scrollY,
    sidebar: document.querySelector(".sidebar")?.scrollTop || 0,
    wsRail: document.getElementById("wsRailBody")?.scrollTop || 0,
    scenarioRail: document.getElementById("scenarioRailBody")?.scrollTop || 0,
    content: document.getElementById("mainContent")?.scrollTop || 0
  };
}

function restoreScrollState(state, focusLever = null) {
  if (!state) return;
  window.scrollTo({ left: state.x, top: state.y, behavior: "auto" });
  const sidebar = document.querySelector(".sidebar");
  if (sidebar) sidebar.scrollTop = state.sidebar;
  const content = document.getElementById("mainContent");
  if (content && state.content) content.scrollTop = state.content;
  const wsBody = document.getElementById("wsRailBody");
  if (wsBody && state.wsRail) wsBody.scrollTop = state.wsRail;
  const scenarioBody = document.getElementById("scenarioRailBody");
  if (scenarioBody && state.scenarioRail) scenarioBody.scrollTop = state.scenarioRail;
  if (focusLever) document.querySelector(`[data-lever="${focusLever}"]`)?.focus({ preventScroll: true });
}

function renderPageControls() {
  if (WS_PAGES.includes(PAGE)) {
    return "";
  }
  return "";
}

function render({ preserveScroll = true, focusLever = null } = {}) {
  const scrollState = preserveScroll ? captureScrollState() : null;
  dxSyncSeed();
  document.getElementById("app").innerHTML = `<div class="app-shell">${renderSidebar()}<main class="main-shell">${renderTopbar()}<div class="content" id="mainContent">${renderImpactStrip()}${renderConfigStrip()}${renderPageControls()}${renderPage()}</div></main></div>`;
  wireEvents();
  wsWireEvents();
  wireRetailV2();
  dxWireEvents();
  decorateConsultantCards();
  if (scrollState) window.requestAnimationFrame(() => restoreScrollState(scrollState, focusLever));
}

/* Ran once on DOMContentLoaded before, which meant the very next render wiped
   it. It belongs inside the render cycle. */
function decorateConsultantCards() {
  document.querySelectorAll(".page-section").forEach((section) => section.classList.add("consultant-card"));
  document.querySelectorAll(".viz-card, .chart-frame, .dashboard-card").forEach((el) => el.setAttribute("data-consultant", "true"));
}

/* Every page states the assumptions its numbers were produced under, and
   marks the ones moved away from the signed off baseline. It is the audit
   trail for the reader as much as a control readout. */
function renderConfigStrip() {
  const onDesign = WS_PAGES.includes(PAGE);
  const showRetail = !onDesign || PAGE === "overview";
  const showDesign = onDesign || PAGE === "overview";
  const cells = [];
  if (showDesign) {
    const brand = wsBrand();
    const level = wsEffectiveAutonomy(brand);
    const connected = WS_SIGNALS.filter((sig) => WS.signals[sig.id]).length;
    cells.push({ key: "Brand in scope", val: brand.name, changed: WS.brand !== "SPD" });
    cells.push({ key: "AI involvement", val: `${WS_AUTONOMY[level].label}${WS.autonomy > brand.maxAI ? " (capped)" : ""}`, changed: WS.autonomy !== 3 });
    cells.push({ key: "Review model", val: wsReviewMode().label, changed: WS.review !== "threshold" });
    cells.push({ key: "Signals connected", val: `${connected} of 6 · ${Math.round(wsSignalCoverage() * 100)}% coverage`, changed: connected !== WS_SIGNALS.length });
    cells.push({ key: "Configured cycle", val: `${wsCycle().total.toFixed(1)} wks`, changed: false });
  }
  if (showRetail) {
    LEVERS.forEach((lever) => cells.push({ key: lever.label, val: lever.format(L[lever.key]), changed: L[lever.key] !== BASE_L[lever.key] }));
  }
  if (!cells.length) return "";
  return `<section class="cfg-strip" aria-label="Active assumptions behind this page">
    ${cells.map((cell) => `<div class="cfg-cell ${cell.changed ? "is-changed" : ""}" title="${escapeHTML(cell.key)}"><span class="cfg-key">${escapeHTML(cell.key)}</span><span class="cfg-val">${escapeHTML(cell.val)}</span></div>`).join("")}
  </section>`;
}

function selectAction(action) {
  if (!action) return;
  SELECTED_ID = actionKey(action);
  SELECTED_SNAPSHOT = null;
  DECISION_STATUS = null;
  REJECT_CONFIRM = false;
  render();
}

function scheduleModelRun(focusLever = null) {
  window.clearTimeout(debounceTimer);
  debounceTimer = window.setTimeout(() => {
    run();
    render({ preserveScroll: true, focusLever });
  }, 120);
}

function focusScenarioRail() {
  SCENARIO_COLLAPSED = false;
  render();
  window.setTimeout(() => {
    const target = WS_PAGES.includes(PAGE) ? document.getElementById("wsControls") : document.getElementById("scenarioRail");
    target?.scrollIntoView({ block: "start", behavior: "smooth" });
  }, 0);
}

function changePage(page) {
  PAGE = page;
  // Panels open only when their own chevron is clicked, never on navigation.
  if (page === "scenario") SIDEBAR_EXPANDED = window.innerWidth <= 760;
  // The nav scrolls inside the sidebar. Rebuilding the markup would drop that
  // offset and throw the reader back to the top of the list, so it is carried
  // across by hand. Only the reading pane returns to the top.
  const navScroll = document.querySelector(".sidebar")?.scrollTop || 0;
  render({ preserveScroll: false });
  window.scrollTo({ top: 0, behavior: "auto" });
  document.querySelector(".content")?.scrollTo?.({ top: 0 });
  restoreNavScroll(navScroll);
}

/* Set once immediately and again after layout, because a fresh sidebar clamps
   scrollTop to zero until its children have been measured. */
function restoreNavScroll(offset) {
  if (!offset) return;
  const apply = () => {
    const sidebar = document.querySelector(".sidebar");
    if (sidebar) sidebar.scrollTop = offset;
  };
  apply();
  window.requestAnimationFrame(apply);
}

function wireEvents() {
  document.querySelectorAll("[data-page]").forEach((button) => {
    button.addEventListener("click", () => changePage(button.dataset.page));
  });
  document.querySelectorAll("[data-focus-scenario]").forEach((button) => button.addEventListener("click", focusScenarioRail));
  document.querySelectorAll("[data-toggle-sidebar]").forEach((button) => button.addEventListener("click", () => { SIDEBAR_EXPANDED = !SIDEBAR_EXPANDED; render(); }));
  document.querySelectorAll("[data-toggle-scenario]").forEach((button) => button.addEventListener("click", () => { SCENARIO_COLLAPSED = !SCENARIO_COLLAPSED; render(); }));
  document.querySelectorAll("[data-lever]").forEach((input) => {
    input.addEventListener("input", () => {
      L[input.dataset.lever] = Number(input.value);
      PRESET = "Adjusted";
      const output = document.querySelector(`[data-lever-value="${input.dataset.lever}"]`);
      if (output) output.textContent = fmtLever(input.dataset.lever);
      scheduleModelRun(input.dataset.lever);
    });
  });
  document.querySelectorAll("[data-preset]").forEach((button) => button.addEventListener("click", () => {
    const preset = PRESETS.find((item) => item.name === button.dataset.preset);
    if (!preset) return;
    L = { ...preset.values };
    PRESET = preset.name;
    run();
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-action-id]").forEach((row) => row.addEventListener("click", () => selectAction(QUEUE.find((action) => actionKey(action) === row.dataset.actionId))));
  document.querySelectorAll("[data-cell]").forEach((cellButton) => cellButton.addEventListener("click", () => {
    const [storeId, categoryId] = cellButton.dataset.cell.split("|");
    FILTER = FILTER?.storeId === storeId && FILTER?.categoryId === categoryId ? null : { storeId, categoryId };
    PAGE = "review";
    render();
  }));
  document.querySelectorAll("[data-clear-filter]").forEach((button) => button.addEventListener("click", () => { FILTER = null; render(); }));
  document.querySelectorAll("[data-accept]").forEach((button) => button.addEventListener("click", () => {
    const action = getSelectedAction();
    if (!action || DECISION_STATUS) return;
    SELECTED_SNAPSHOT = snapshotAction(action);
    applyAccept(action);
    DECISION_STATUS = "Accepted";
    REJECT_CONFIRM = false;
    run();
    render();
  }));
  document.querySelectorAll("[data-reject]").forEach((button) => button.addEventListener("click", () => {
    if (DECISION_STATUS) { DECISION_STATUS = null; SELECTED_SNAPSHOT = null; render(); return; }
    REJECT_CONFIRM = true;
    render();
  }));
  document.querySelectorAll("[data-cancel-reject]").forEach((button) => button.addEventListener("click", () => { REJECT_CONFIRM = false; render(); }));
  document.querySelectorAll("[data-docket-more]").forEach((button) => button.addEventListener("click", () => { DOCKET_SHOWN += 20; render({ preserveScroll: true }); }));
  document.querySelectorAll("[data-docket-all]").forEach((button) => button.addEventListener("click", () => { DOCKET_SHOWN = QUEUE.length; render({ preserveScroll: true }); }));
  document.querySelectorAll("[data-docket-reset]").forEach((button) => button.addEventListener("click", () => { DOCKET_SHOWN = 20; render({ preserveScroll: true }); }));
  const queueAction = (key) => QUEUE.find((item) => actionKey(item) === key);
  document.querySelectorAll("[data-queue-accept]").forEach((button) => button.addEventListener("click", (event) => {
    event.stopPropagation();
    const action = queueAction(button.dataset.queueAccept);
    if (!action || action.c.accepted) return;
    selectAction(action);
    SELECTED_SNAPSHOT = snapshotAction(action);
    applyAccept(action);
    DECISION_STATUS = "Accepted";
    REJECT_CONFIRM = false;
    run();
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-queue-reject]").forEach((button) => button.addEventListener("click", (event) => {
    event.stopPropagation();
    const action = queueAction(button.dataset.queueReject);
    if (!action || action.c.accepted) return;
    selectAction(action);
    SELECTED_SNAPSHOT = snapshotAction(action);
    applyReject(action);
    DECISION_STATUS = "Rejected";
    REJECT_CONFIRM = false;
    run();
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-confirm-reject]").forEach((button) => button.addEventListener("click", () => {
    const action = getSelectedAction();
    if (!action) return;
    SELECTED_SNAPSHOT = snapshotAction(action);
    applyReject(action);
    DECISION_STATUS = "Rejected";
    REJECT_CONFIRM = false;
    run();
    render();
  }));
  document.querySelectorAll("[data-refresh]").forEach((button) => button.addEventListener("click", () => loadData()));
  document.querySelectorAll("[data-clear-notice]").forEach((button) => button.addEventListener("click", () => { decisionNotice = ""; render(); }));
}

async function loadData() {
  loadState = "loading";
  loadError = "";
  render();
  try {
    if (DEMO_MODE) {
      await new Promise((resolve) => window.setTimeout(resolve, 200));
      seedDemoData();
      OFFLINE = true;
    } else {
      try {
        await buildData();
        OFFLINE = false;
      } catch (serviceError) {
        console.warn("[control-tower] service unavailable, using packaged demonstration data", serviceError);
        seedDemoData();
        OFFLINE = true;
      }
    }
    run();
    if (!M_BASE) M_BASE = { margRisk: M.margRisk, revRisk: M.revRisk, wc: M.wc, mdExp: M.mdExp, recovered: 0 };
    loadState = "ready";
    render();
  } catch (error) {
    console.error("[control-tower] data refresh failed", error);
    loadError = error instanceof Error ? error.message : String(error);
    loadState = "error";
    render();
  }
}

/* ------------------------------------------------------------- helpers -- */

function projectedState(cell) {
  const map = { RISK: "OUT", BLOCKED: "OUT", BREAKOUT: "OUT", IMBAL: "RISK", SLOW: "TERMINAL" };
  return map[cell.state] || cell.state;
}

function projection() {
  let margin = 0;
  let markdown = 0;
  const dist = Object.fromEntries(ORDER.map((state) => [state, 0]));
  CELLS.forEach((cell) => {
    const state = projectedState(cell);
    dist[state] += 1;
    if (["OUT", "RISK", "BLOCKED", "IMBAL"].includes(state)) {
      margin += Math.max(0, cell.fc * 4 - cell.onHand - cell.inTransit) * cell.unit;
    }
    if (["TERMINAL", "SLOW"].includes(state)) {
      markdown += Math.max(0, cell.onHand - cell.fc * Math.max(1, L.weeks - 4)) * cell.sku.cogs * 0.7;
    }
  });
  return { dist, margin, markdown, total: margin + markdown };
}

function medianCover() {
  const values = CELLS.map((cell) => cell.cover).sort((a, b) => a - b);
  if (!values.length) return 0;
  const middle = Math.floor(values.length / 2);
  return values.length % 2 ? values[middle] : (values[middle - 1] + values[middle]) / 2;
}

function queueValue() {
  return QUEUE.reduce((sum, action) => sum + Math.max(0, action.val), 0);
}

function recoveryRate() {
  const exposure = M.margRisk + M.mdExp;
  return exposure > 0 ? Math.min(1, queueValue() / exposure) : 0;
}

function donut(segments, centre, caption) {
  const size = 132;
  const radius = 49;
  const stroke = 17;
  const circumference = 2 * Math.PI * radius;
  const total = segments.reduce((sum, segment) => sum + segment.value, 0) || 1;
  let offset = 0;
  const arcs = segments.filter((segment) => segment.value > 0).map((segment) => {
    const length = (segment.value / total) * circumference;
    const arc = `<circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="${segment.color}" stroke-width="${stroke}" stroke-dasharray="${length - 1.5} ${circumference - length + 1.5}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${size / 2} ${size / 2})"><title>${escapeHTML(segment.label)}: ${segment.value}</title></circle>`;
    offset += length;
    return arc;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${escapeHTML(caption)}">
    <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="#F7F3ED" stroke-width="${stroke}"/>${arcs}<circle cx="${size / 2}" cy="${size / 2}" r="${radius + stroke / 2}" fill="none" stroke="#D8D2C8" stroke-width="1"/><circle cx="${size / 2}" cy="${size / 2}" r="${radius - stroke / 2}" fill="none" stroke="#D8D2C8" stroke-width="1"/>
    <text x="${size / 2}" y="${size / 2 - 1}" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">${escapeHTML(centre)}</text>
    <text x="${size / 2}" y="${size / 2 + 13}" text-anchor="middle" font-size="9" fill="#4F4A44">${escapeHTML(caption)}</text>
  </svg>`;
}

function histogram(buckets) {
  const width = 420;
  const height = 168;
  const left = 30;
  const bottom = 26;
  const max = Math.max(...buckets.map((bucket) => bucket.count), 1);
  const slot = (width - left - 10) / buckets.length;
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Weeks of cover distribution">
    ${buckets.map((bucket, index) => {
      const barHeight = ((height - bottom - 14) * bucket.count) / max;
      const x = left + index * slot + 4;
      const y = height - bottom - barHeight;
      return `<rect x="${x}" y="${y}" width="${slot - 8}" height="${barHeight}" fill="${bucket.color}" rx="2"><title>${escapeHTML(bucket.label)}: ${bucket.count}</title></rect>
      <text x="${x + (slot - 8) / 2}" y="${y - 4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1A1A1A">${bucket.count}</text>
      <text x="${x + (slot - 8) / 2}" y="${height - 9}" text-anchor="middle" font-size="10.5" fill="#4F4A44">${escapeHTML(bucket.label)}</text>`;
    }).join("")}
    <line x1="${left}" y1="${height - bottom}" x2="${width - 6}" y2="${height - bottom}" stroke="#D8D2C8"/>
  </svg>`;
}

function sparkline(values, floor) {
  const width = 420;
  const height = 128;
  const left = 34;
  const top = 12;
  const bottom = 22;
  const max = Math.max(...values, floor) + 2;
  const min = Math.min(...values, floor) - 2;
  const x = (index) => scale(index, 0, values.length - 1, left, width - 10);
  const y = (value) => scale(value, min, max, height - bottom, top);
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Model accuracy by week against the rollback floor">
    <line x1="${left}" y1="${y(floor)}" x2="${width - 10}" y2="${y(floor)}" stroke="#7A0F0A" stroke-dasharray="4 4"/>
    <text x="${width - 12}" y="${y(floor) - 5}" text-anchor="end" font-size="10.5" font-weight="700" fill="#7A0F0A">rollback floor ${floor}%</text>
    <path d="${linePath(values.map((value, index) => [x(index), y(value)]))}" fill="none" stroke="#2D2A26" stroke-width="2.4"/>
    ${values.map((value, index) => `<circle cx="${x(index)}" cy="${y(value)}" r="2.8" fill="#2D2A26"><title>Week ${index + 1}: ${value}%</title></circle>`).join("")}
    <text x="${left}" y="${height - 6}" font-size="10.5" fill="#4F4A44">wk 21</text>
    <text x="${width - 10}" y="${height - 6}" text-anchor="end" font-size="10.5" fill="#4F4A44">wk 32</text>
  </svg>`;
}

function miniDocket(actions, limit = 6) {

/* Stock in the wrong place, drawn as lanes. */
function transferFlow(transfers) {
  if (!transfers.length) return "";

  const takers = [...new Set(top.map((action) => action.c.store.name))];
  const width = 700;
  const rowHeight = 34;
  const height = Math.max(donors.length, takers.length) * rowHeight + 54;
  const leftX = 168;
  const rightX = width - 168;
  const yOf = (list, name) => 40 + list.indexOf(name) * rowHeight;
  const maxQty = Math.max(...top.map((action) => action.qty), 1);
  const links = top.map((action) => {
    const y1 = yOf(donors, action.from?.store.name);
    const y2 = yOf(takers, action.c.store.name);
    const stroke = 2 + (action.qty / maxQty) * 9;
    return `<path d="M${leftX} ${y1} C${(leftX + rightX) / 2} ${y1}, ${(leftX + rightX) / 2} ${y2}, ${rightX} ${y2}" fill="none" stroke="#2D2A26" stroke-opacity="0.38" stroke-width="${stroke.toFixed(1)}" stroke-linecap="round"><title>${escapeHTML(action.c.sku.id)}: ${fmtUnits(action.qty)} u</title></path>`;
  }).join("");
  const node = (name, x, anchor, tone) => `<circle cx="${x}" cy="${yOf(anchor === "end" ? donors : takers, name)}" r="5" fill="${tone}"/><text x="${x + (anchor === "end" ? -12 : 12)}" y="${yOf(anchor === "end" ? donors : takers, name) + 4}" text-anchor="${anchor === "end" ? "end" : "start"}" font-size="11" fill="#D04A02">${escapeHTML(name)}</text>`;
  return `<div class="viz-card"><h4>Where the stock should move</h4><p>Line weight is units. Left is over covered, right is short.</p>
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Proposed stock transfers between stores">
      <text x="${leftX}" y="18" text-anchor="end" font-size="10" fill="#D04A02">HOLDING TOO MUCH</text>
      <text x="${rightX}" y="18" font-size="10" fill="#D04A02">SHORT</text>
      ${links}
      ${donors.map((name) => node(name, leftX, "end", "#C9A227")).join("")}
      ${takers.map((name) => node(name, rightX, "start", "#C6007E")).join("")}
    </svg>
    <div class="viz-legend"><span><i style="background:#C9A227"></i>Donor store, over covered</span><span><i style="background:#C6007E"></i>Recipient store, short</span><span><i style="background:#2D2A26"></i>Proposed move, thicker means more units</span></div>
    <div class="viz-caption"><strong>How to read it.</strong> No stock is bought here. Every line is inventory the company already owns, moving to where it will sell.</div>
  </div>`;
}

/* ----------------------------------------------------- 3 · network ------ */

function renderNetworkPage() {
  const transfers = QUEUE.filter((action) => action.t === "Transfer");
  const over = [];
  const under = [];
  STORES.forEach((store) => {
    const cells = CELLS.filter((cell) => cell.store.id === store.id);
    const excess = cells.reduce((sum, cell) => sum + Math.max(0, cell.onHand - cell.fc * 4), 0);
    const gap = cells.reduce((sum, cell) => sum + Math.max(0, cell.gap), 0);
    over.push({ label: store.name, value: excess, tone: "amber" });
    under.push({ label: store.name, value: gap, tone: "red" });
  });
  const rows = transfers.map((action) => {
    const cost = action.qty * L.tcost + 1500;
    return { action, cost, perRupee: action.val / Math.max(1, cost) };
  }).sort((a, b) => b.perRupee - a.perRupee);

  return `${renderRefreshNotice()}
  <section class="page-section">${transferFlow(rows.map((row) => row.action))}</section>
  <section class="page-grid-2">
    <div class="rule-panel"><h4>Sitting on too much</h4><p>Units above four weeks of cover.</p>${renderBars(over.slice().sort((a, b) => b.value - a.value))}</div>
    <div class="rule-panel"><h4>Short of the horizon</h4><p>Open units needed inside lead time.</p>${renderBars(under.slice().sort((a, b) => b.value - a.value))}</div>
  </section>
  <section class="page-section">
    <div class="section-head"><div><h3>Move stock before buying more</h3><p>Ranked by margin recovered per rupee of transfer cost.</p></div><span class="count-note">${transfers.length} clear the hurdle</span></div>
    ${rows.length ? `<div class="ws-table-wrap"><table class="ws-table"><thead><tr><th>SKU</th><th>From</th><th>To</th><th>Units</th><th>Cost</th><th>Margin recovered</th><th>Per ₹1</th></tr></thead><tbody>${rows.map(({ action, cost, perRupee }) => `<tr class="docket-row" data-open-decision="${escapeHTML(actionKey(action))}"><td><strong>${escapeHTML(action.c.sku.id)}</strong></td><td>${escapeHTML(action.from?.store.name || "none")}</td><td>${escapeHTML(action.c.store.name)}</td><td>${fmtUnits(action.qty)}</td><td>${fmtINR(cost)}</td><td class="value">${fmtINR(action.val)}</td><td><strong>₹${perRupee.toFixed(1)}</strong></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty-state"><strong>No transfer clears the hurdle.</strong>At ₹${L.tcost} per unit the move costs more than it recovers.</div>`}
  </section>
  <section class="page-grid-2">
    <div class="rule-panel"><h4>Transfer economics</h4><p>The hurdle every move has to clear.</p><div class="kv-list">
      <div class="kv-row"><span>Cost per unit</span><strong>₹${L.tcost}</strong></div>
      <div class="kv-row"><span>Fixed lane cost</span><strong>₹1,500</strong></div>
      <div class="kv-row"><span>Value if all approved</span><strong>${fmtINR(transfers.reduce((sum, action) => sum + action.val, 0))}</strong></div>
      <div class="kv-row"><span>Units moved</span><strong>${fmtUnits(transfers.reduce((sum, action) => sum + action.qty, 0))}</strong></div>
    </div></div>
    <div class="rule-panel"><h4>Why this comes first</h4><p>Stock is in the wrong place, not the wrong quantity.</p><div class="readout"><strong>A transfer settles in days; a cut takes ${L.lead} of them.</strong> Every unit moved here is a unit that does not need capacity that is already committed.</div></div>
  </section>`;
}

/* ------------------------------------------------------ 4 · margin ------ */

function renderMarginPage() {
  const candidates = QUEUE.filter((action) => action.t === "Markdown");
  const cell = candidates[0]?.c || CELLS.slice().sort((a, b) => b.cover - a.cover)[0];
  const byCategory = CATS.map((category) => {
    const cells = CELLS.filter((item) => item.sku.cat.id === category.id);
    return {
      label: category.name,
      value: cells.reduce((sum, item) => sum + item.unmet * item.unit + item.over * item.sku.cogs * 0.55, 0),
      tone: "red"
    };
  }).sort((a, b) => b.value - a.value);
  const sellThrough = CATS.map((category) => {
    const cells = CELLS.filter((item) => item.sku.cat.id === category.id);
    const value = (cells.reduce((sum, item) => sum + item.sold, 0) / Math.max(1, cells.reduce((sum, item) => sum + item.recv, 0))) * 100;
    return { label: category.name, value, tone: value < M.planST * 62 ? "amber" : "green" };
  }).sort((a, b) => b.value - a.value);

  return `${renderRefreshNotice()}
  <section class="page-grid-2">
    <div class="rule-panel"><h4>Margin at risk by category</h4><p>Unmet demand plus markdown exposure. Start at the top.</p>${renderBars(byCategory, fmtINR)}</div>
    <div class="rule-panel"><h4>Sell through by category</h4><p>Sold against received. Plan is ${Math.round(M.planST * 100)}%.</p>${renderBars(sellThrough, (value) => `${value.toFixed(0)}%`)}</div>
  </section>
  <section class="page-grid-2">
    <div class="rule-panel"><h4>How deep to go</h4><p>${cell ? `${escapeHTML(cell.sku.name)} · ${escapeHTML(cell.store.name)}` : "No candidate"}</p>${cell ? `<div class="chart-frame">${ladderChart(cell)}</div>` : ""}
      <div class="viz-legend"><span><i style="background:#C9A227"></i>Modelled margin at each discount depth</span><span><i style="background:#C6007E;border-radius:50%"></i>Recommended depth</span><span><i style="background:#2D2A26;border-radius:50%"></i>Other depths tested</span><span><i style="background:#7A0F0A;width:3px;height:12px"></i>40% guardrail, human signature beyond</span></div>
      <div class="readout"><strong>Margin peaks, then falls.</strong> Modelled as demand at each depth less the salvage loss on what is left. Anything past 40% needs a human signature.</div>
    </div>
    <div class="rule-panel"><h4>Season position</h4><p>What changes as weeks run out.</p><div class="kv-list">
      <div class="kv-row"><span>Weeks remaining</span><strong>${L.weeks}</strong></div>
      <div class="kv-row"><span>Over-covered positions</span><strong>${(M.dist.SLOW || 0) + (M.dist.TERMINAL || 0)}</strong></div>
      <div class="kv-row"><span>Markdown exposure</span><strong>${fmtINR(M.mdExp)}</strong></div>
      <div class="kv-row"><span>Recoverable by markdown</span><strong>${fmtINR(candidates.reduce((sum, action) => sum + action.val, 0))}</strong></div>
    </div>
    <div class="section-head" style="margin-top:20px"><div><h3>Discount it, or move it</h3><p>A markdown is not the only way out of over cover. Moving the stock to a store that is short keeps the full price.</p></div></div>
    <div class="kv-list">
      <div class="kv-row"><span>Cost to move a unit</span><strong>₹${L.tcost}</strong></div>
      <div class="kv-row"><span>Average margin given up at the recommended depth</span><strong>${fmtINR(candidates.length ? candidates.reduce((sum, action) => sum + (action.c.sku.price * (action.depth / 100)), 0) / candidates.length : 0)} a unit</strong></div>
      <div class="kv-row"><span>Cheaper to move than to discount</span><strong>${candidates.filter((action) => action.c.sku.price * (action.depth / 100) > L.tcost).length} of ${candidates.length} positions</strong></div>
      <div class="kv-row"><span>Transfers already clearing the hurdle</span><strong>${QUEUE.filter((action) => action.t === "Transfer").length}</strong></div>
    </div>
    <div class="readout"><strong>Markdown is the last option, not the first.</strong> Where the discount needed is worth more than ₹${L.tcost} a unit, the network page has a move that keeps the margin instead of writing it off.</div>
    <div class="section-head" style="margin-top:20px"><div><h3>Take these first</h3></div><span class="count-note">${candidates.length} open</span></div>
    ${miniDocket(candidates, 5)}
    </div>
  </section>`;
}

/* ------------------------------------------------------ 5 · supply ------ */

function renderSupplyPage() {
  const rows = SUPPLIERS.map((supplier) => {
    const cells = CELLS.filter((cell) => cell.sku.sup.id === supplier.id);
    const need = cells.reduce((sum, cell) => sum + Math.max(0, cell.gap), 0);
    const served = cells.reduce((sum, cell) => sum + (cell.served || 0), 0);
    const capacity = L.cap * supplier.share;
    const lead = Math.round(L.lead * (1 + (1 - supplier.rel) * 0.9));
    return { supplier, need, served, capacity, lead, use: Math.min(1, served / Math.max(1, capacity)) };
  });
  const recuts = QUEUE.filter((action) => action.t === "Recut");
  const blocked = QUEUE.filter((action) => action.t === "Escalate");

  const peak = Math.max(...rows.map((row) => Math.max(row.capacity, row.served + row.need)), 1);
  return `${renderRefreshNotice()}
  <section class="page-section">
    <div class="section-head"><div><h3>Demand against available capacity</h3><p>Committed volume, open need and free capacity for every supplier this week.</p></div><span class="count-note">${fmtUnits(L.cap)} u total weekly capacity</span></div>
    <div class="cap-chart">
      ${rows.map(({ supplier, need, served, capacity, use }) => {
        const committed = Math.min(served, capacity);
        const free = Math.max(0, capacity - committed);
        const shortfall = Math.max(0, served + need - capacity);
        const pressure = use > 0.95 || shortfall > 0;
        return `<div class="cap-row">
          <div class="cap-name"><strong>${escapeHTML(supplier.name)}</strong><span>${Math.round(supplier.rel * 100)}% on time · ${fmtUnits(capacity)} u capacity</span></div>
          <div class="cap-track">
            <span class="cap-seg cap-committed" style="width:${((committed / peak) * 100).toFixed(1)}%" title="Committed ${fmtUnits(committed)} u"></span>
            <span class="cap-seg cap-free" style="width:${((free / peak) * 100).toFixed(1)}%" title="Free ${fmtUnits(free)} u"></span>
            ${shortfall > 0 ? `<span class="cap-seg cap-short" style="width:${((shortfall / peak) * 100).toFixed(1)}%" title="Shortfall ${fmtUnits(shortfall)} u"></span>` : ""}
          </div>
          <div class="cap-figure"><strong class="${pressure ? "is-pressure" : ""}">${Math.round(use * 100)}%</strong><span>utilised</span></div>
          <div class="cap-status"><span class="state-pill ${shortfall > 0 ? "cap-pill-short" : use > 0.95 ? "cap-pill-tight" : "cap-pill-ok"}">${shortfall > 0 ? `${fmtUnits(shortfall)} u short` : use > 0.95 ? "At capacity" : "Headroom"}</span></div>
        </div>`;
      }).join("")}
      <div class="cap-axis"><span>0</span><span>${fmtUnits(peak / 2)} u</span><span>${fmtUnits(peak)} u per week</span></div>
      <div class="viz-legend">
        <span><i style="background:#D04A02"></i>Committed volume</span>
        <span><i style="background:#EFEAE1;border:1px solid #D8D2C8"></i>Free capacity</span>
        <span><i style="background:#C6007E"></i>Shortfall beyond capacity</span>
      </div>
    </div>
  </section>
  <section class="page-section">
    <div class="section-head"><div><h3>Who can actually deliver</h3><p>Reliability and lead time decide which supplier gets the urgent cut.</p></div><span class="count-note">${SUPPLIERS.length} suppliers</span></div>
    <div class="ws-table-wrap"><table class="ws-table"><thead><tr><th>Supplier</th><th>On time</th><th>Quality</th><th>Lead time</th><th>Open need</th><th>Weekly capacity</th><th>Used</th></tr></thead><tbody>${rows.map(({ supplier, need, served, capacity, lead, use }) => `<tr><td><strong>${escapeHTML(supplier.name)}</strong></td><td>${Math.round(supplier.rel * 100)}%</td><td>${Math.round((0.88 + supplier.rel * 0.1) * 100)}%</td><td>${lead} days</td><td>${fmtUnits(need)} u</td><td>${fmtUnits(capacity)} u</td><td><strong>${Math.round(use * 100)}%</strong><div class="alloc-track"><span class="alloc-fill" style="width:${Math.round(use * 100)}%;background:${use > 0.95 ? "var(--red)" : "var(--primary-purple)"}"></span></div></td></tr>`).join("")}</tbody></table></div>
  </section>
  <section class="page-grid-2">
    <div class="rule-panel"><h4>Capacity book</h4><p>The honest part of the model.</p><div class="kv-list">
      <div class="kv-row"><span>Weekly capacity</span><strong>${fmtUnits(L.cap)} u</strong></div>
      <div class="kv-row"><span>Committed</span><strong>${fmtUnits(M.capNeed)} u</strong></div>
      <div class="kv-row"><span>Free</span><strong>${fmtUnits(M.capLeft)} u</strong></div>
      <div class="kv-row"><span>Positions blocked</span><strong>${M.dist.BLOCKED || 0}</strong></div>
      <div class="kv-row"><span>Blocked units servable by transfer instead</span><strong>${fmtUnits(Math.min(blocked.reduce((sum, action) => sum + action.qty, 0), CELLS.reduce((sum, cell) => sum + Math.max(0, cell.onHand - cell.fc * 4), 0)))} u at ₹${L.tcost} a unit</strong></div>
      <div class="kv-row"><span>Cost of that alternative</span><strong>${fmtINR(Math.min(blocked.reduce((sum, action) => sum + action.qty, 0), CELLS.reduce((sum, cell) => sum + Math.max(0, cell.onHand - cell.fc * 4), 0)) * L.tcost)}</strong></div>
    </div>
      <div class="section-head" style="margin-top:20px"><div><h3>Cannot be filled</h3><p>Substitute or accept the loss.</p></div><span class="count-note">${blocked.length}</span></div>
      ${miniDocket(blocked, 4)}
    </div>
    <div class="rule-panel"><h4>Worth recutting</h4><p>Selling ahead of plan with capacity still free.</p>${miniDocket(recuts, 6)}
      <div class="readout"><strong>Recut beats a bigger first buy.</strong> A short first order plus one in season cut carries less markdown risk than committing everything pre season.</div>
    </div>
  </section>`;
}

/* --------------------------------------------------- 6 · decisions ------ */

function renderDecisionsPage() {
  const accepted = LOG.filter((entry) => entry.decision === "Accepted").length;
  const rejected = LOG.filter((entry) => entry.decision === "Rejected").length;
  const stillAtRisk = Math.max(0, M.margRisk + M.mdExp - RECOVERED);
  const total = Math.max(1, RECOVERED + stillAtRisk);
  const types = ["Replenish", "Transfer", "Recut", "Markdown", "Escalate"];
  return `${renderRefreshNotice()}
  <section class="page-section">
    <div class="viz-card"><h4>How a decision moves</h4><p>The model ranks. The planner decides. The reason is recorded either way.</p>
      <div class="flow-steps">
        <div class="flow-step"><span>01</span><strong>Ranked</strong><em>Model scores every position by value at risk</em></div>
        <div class="flow-step"><span>02</span><strong>Evidenced</strong><em>Cover, demand and supply shown before any click</em></div>
        <div class="flow-step"><span>03</span><strong>Decided</strong><em>Planner accepts or rejects, never the model</em></div>
        <div class="flow-step"><span>04</span><strong>Recorded</strong><em>Reason code returns to the next retrain</em></div>
      </div>
    </div>
  </section>
  <section class="page-section">
    <div class="section-head"><div><h3>Impact this session</h3><p>Recovered against what is still exposed.</p></div><span class="count-note">${accepted} accepted · ${rejected} rejected</span></div>
    <div class="split-bar"><span class="split-seg" style="flex:0 0 ${((RECOVERED / total) * 100).toFixed(1)}%;background:var(--green)">${fmtINR(RECOVERED)}</span><span class="split-seg" style="flex:1;background:var(--rule);color:var(--muted)">${fmtINR(stillAtRisk)} still at risk</span></div>
    <div class="viz-legend"><span><i style="background:var(--green)"></i>Margin recovered by accepted decisions</span><span><i style="background:var(--rule)"></i>Still exposed, awaiting a call</span></div>
  </section>
  <section class="page-section">
    <div class="section-head"><div><h3>Queue: what needs a call</h3><p>Ranked by value. Select a row, read the evidence on the right, then accept or reject.</p></div><span class="count-note">${QUEUE_TOTAL} open</span></div>
    <div class="viz-legend" style="margin:0 0 12px">${types.map((type) => `<span><i class="action-mark ${ACTION_MARKS[type] || "graphite"}" style="width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px"></i>${type}</span>`).join("")}</div>
    ${renderActionDocket(20)}
  </section>
  <section class="page-section">
    <div class="section-head"><div><h3>Evidence and decision</h3><p>Nothing is approved without the position behind it.</p></div></div>
    <div class="left-lower">${renderInspector()}${renderSelectedPosition()}</div>
  </section>
  <section class="page-grid-2">
    <div class="rule-panel"><h4>Do planners trust it?</h4><p>Acceptance by action type, last 90 days.</p>
      <div class="ws-table-wrap" style="border:none;box-shadow:none"><table class="ws-table"><thead><tr><th>Type</th><th>Raised</th><th>Accepted</th><th>Value taken</th></tr></thead><tbody>${DECISION_HISTORY.map((row) => `<tr><td><span class="action-name"><i class="action-mark ${ACTION_MARKS[row.type] || "graphite"}"></i>${row.type}</span></td><td>${row.raised}</td><td><strong>${Math.round(row.accepted * 100)}%</strong><div class="alloc-track"><span class="alloc-fill" style="width:${Math.round(row.accepted * 100)}%"></span></div></td><td>${row.value ? `₹${row.value.toFixed(1)} Cr` : "none"}</td></tr>`).join("")}</tbody></table></div>
      <div class="readout"><strong>Markdown is trusted least, at 54%.</strong> That is the signal to look at, not to suppress: rejections carry reason codes and go back into the next retrain.</div>
    </div>
    ${renderDecisionRecord()}
  </section>`;
}

function wireRetailV2() {
  document.querySelectorAll("[data-board-view]").forEach((button) => button.addEventListener("click", () => {
    BOARD_VIEW = button.dataset.boardView;
    render({ preserveScroll: true });
  }));
  document.querySelectorAll("[data-open-decision]").forEach((row) => row.addEventListener("click", () => {
    const action = QUEUE.find((item) => actionKey(item) === row.dataset.openDecision);
    if (!action) return;
    SELECTED_ID = actionKey(action);
    SELECTED_SNAPSHOT = null;
    DECISION_STATUS = null;
    changePage("decisions");
  }));
}

loadData();
